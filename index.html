<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projectregister · HTM tekeningcontrole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #f4f6f7; --sheet: #ffffff; --ink: #1b2430; --pencil: #4c5157; --rule: #1b243024;
    --desk: #12324a; --accent: #135f80; --accent-tint: #e6eff4; --accent-soft: #8cc4de; --red: #b3261e;
    --head: "Public Sans", "Segoe UI", sans-serif;
    --mono: "Source Code Pro", "Consolas", monospace;
    --sq: clamp(196px, calc((100vw - 200px) * .174 - 15px), 290px); /* zijde van een tekeningblok, groeit mee met het scherm */
  }
  * { box-sizing: border-box; }
  html { background: var(--desk); }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: 64px 1fr;
         font: 15px/1.5 var(--head); color: var(--ink); background: var(--desk); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .label { margin: 0 0 4px; font: 600 13px var(--head); color: var(--pencil); }

  /* Linker rail */
  .rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
          gap: 18px; padding-bottom: 18px; color: #fff; }
  .rail::before { content: ""; width: 100%; height: 10px; background: var(--red); }
  .rail nav { display: flex; flex-direction: column; gap: 4px; }
  .rail a { writing-mode: vertical-rl; transform: rotate(180deg); color: #a9bfcd; text-decoration: none;
            font-size: 13px; font-weight: 600; letter-spacing: .08em; padding: 14px 7px; border-right: 3px solid transparent; }
  .rail a:hover { color: #fff; }
  .rail a[aria-current="page"] { color: #fff; border-right-color: var(--accent-soft); }
  .rail a:focus-visible { outline-color: var(--accent-soft); }
  .brand { margin-top: auto; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; letter-spacing: .06em; }
  .brand b { color: #ff8a80; }

  /* Tekenblad met kader en zone-indeling */
  .desk { padding: 14px 14px 14px 0; min-width: 0; }
  .frame { min-height: calc(100vh - 28px); display: grid; grid-template-columns: 24px minmax(0, 1fr);
           grid-template-rows: 24px 1fr; border: 1px solid var(--ink); background: var(--paper); }
  .zones { display: flex; font: 12px var(--mono); color: var(--pencil); }
  .zones span { flex: 1; display: grid; place-items: center; border-left: 1px solid var(--rule); }
  .zones span:first-child { border: 0; }
  .zones.top { grid-area: 1 / 2; border-bottom: 1.5px solid var(--ink); }
  .zones.left { grid-area: 2 / 1; flex-direction: column; border-right: 1.5px solid var(--ink); }
  .zones.left span { border-left: 0; border-top: 1px solid var(--rule); }
  .zones.left span:first-child { border: 0; }
  .inner { grid-area: 2 / 2; display: flex; flex-direction: column; padding: 24px 34px 0; min-width: 0; }
  #app { flex: 1; margin-bottom: 32px; }
  #app:focus { outline: none; }

  /* Titelhoek rechtsonder */
  .titleblock { align-self: flex-end; margin: auto -34px 0 0; display: grid; grid-template-columns: repeat(3, auto);
                border-top: 1.5px solid var(--ink); border-left: 1.5px solid var(--ink); background: var(--sheet);
                min-width: min(520px, 100%); }
  .titleblock div { padding: 4px 12px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .titleblock b { display: block; font-size: 12px; font-weight: 400; color: var(--pencil); }
  .titleblock span { font-size: 14px; font-weight: 600; }
  .titleblock .w2 { grid-column: span 2; }
  .titleblock .w3 { grid-column: span 3; border-bottom: 0; }
  .titleblock .code-val { font-family: var(--mono); font-weight: 500; }

  /* Koppen */
  .view-head { display: grid; grid-template-columns: 1fr auto auto; gap: 28px; align-items: end;
               padding-bottom: 16px; margin-bottom: 22px; border-bottom: 1.5px solid var(--ink); }
  h1 { margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.05; font-weight: 700; letter-spacing: -.015em; }
  .pnr { font-family: var(--mono); font-weight: 500; color: var(--ink); }
  .tally { display: flex; gap: 26px; margin: 0; }
  .tally div { border-left: 1px solid var(--ink); padding-left: 10px; }
  .tally dt { font-size: 13px; font-weight: 600; color: var(--pencil); }
  .tally dd { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tally small { font-size: 15px; font-weight: 400; color: var(--pencil); }
  .back { font-size: 14px; color: var(--ink); text-underline-offset: 3px; }
  .back:hover { color: var(--accent); }

  .btn { display: inline-block; font: 600 15px var(--head); color: #fff; background: var(--accent);
         border: 1.5px solid var(--accent); padding: 8px 16px; text-decoration: none; cursor: pointer; white-space: nowrap;
         transition: background .12s, color .12s; }
  .btn:hover { background: var(--sheet); color: var(--accent); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.ghost:hover { background: var(--accent-tint); }
  .btn:disabled, .btn[aria-disabled="true"] { background: transparent; color: var(--pencil); border-style: dashed;
                                              border-color: var(--pencil); cursor: not-allowed; }
  .btn.sm { font-size: 14px; padding: 5px 12px; }

  .demo-tag { align-self: flex-end; margin: -8px 0 14px; font-size: 13px; font-weight: 600; color: var(--red);
              border: 1.5px solid var(--red); padding: 2px 9px; }

  /* Register (overzicht) */
  .tablewrap { overflow-x: auto; }
  .register { width: 100%; border-collapse: collapse; min-width: 640px; font-variant-numeric: tabular-nums; }
  .register th { font-size: 13px; font-weight: 600; color: var(--ink); text-align: left; padding: 8px 10px;
                 background: var(--accent-tint); border-bottom: 1.5px solid var(--accent); }
  .register th.d { font-family: var(--mono); font-weight: 600; }
  .register td { padding: 13px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; background: var(--sheet); }
  .register .d { text-align: center; width: 52px; }
  .register tbody tr { cursor: pointer; }
  .register tbody tr:hover td { background: #f8fbfc; }
  .register tbody tr:hover .nr { color: var(--accent); }
  .nr { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
  .pname a { color: inherit; text-decoration: none; font-size: 18px; font-weight: 600; }
  .pname small { display: block; font-size: 14px; color: var(--pencil); }
  .count { font-size: 14px; white-space: nowrap; }
  .count.full { color: var(--accent); font-weight: 700; }
  .date { font-family: var(--mono); font-size: 13px; color: var(--pencil); white-space: nowrap; }
  .go { text-align: right; color: var(--pencil); }
  .mark { display: inline-block; width: 16px; height: 16px; border: 1.5px solid #1b243080; vertical-align: middle;
          background: repeating-linear-gradient(-45deg, transparent 0 3px, #1b24303a 3px 4px); }
  .mark.ok { background: var(--accent); border-color: var(--accent); }
  .mark.warn { outline: 2px solid var(--red); outline-offset: 2px; }
  .legend { display: flex; gap: 22px; margin: 12px 0 0; font-size: 14px; color: var(--pencil); }
  .legend .mark { width: 12px; height: 12px; margin-right: 7px; }
  .empty { padding: 40px 0; color: var(--pencil); }

  /* Nieuw project */
  .new { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 44px; align-items: start; }
  .fields { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .fields legend { padding: 0; margin-bottom: 12px; font-size: 16px; font-weight: 700; color: var(--ink); }
  .field > span { display: block; font-size: 13px; font-weight: 600; color: var(--pencil); }
  .field em { font-style: normal; font-weight: 400; }
  .field input { width: 100%; font: 400 18px var(--head); color: var(--ink); background: transparent; border: 0;
                 border-bottom: 1.5px solid var(--ink); border-radius: 0; padding: 5px 0; }
  .field input.mono { font-family: var(--mono); font-size: 17px; }
  .field input::placeholder { color: #1b243075; font-style: italic; }
  .field input:focus { outline: none; border-bottom: 2.5px solid var(--accent); padding-bottom: 4px; }
  .err { min-height: 1.4em; margin: -8px 0 0; color: var(--red); font-size: 14px; }
  .note { margin: 0; padding-left: 10px; border-left: 2px solid var(--accent); font-size: 14px; color: var(--pencil); }

  /* Werkbank: documenten (≈2/3) en analyses (≈1/3); analyses beginnen op ±66% van de breedte */
  .workbench { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 28px; align-items: start; }
  .docs { display: flex; gap: 28px; align-items: flex-start; min-width: 0; }
  .group { display: flex; flex-direction: column; min-width: 0; }
  .group > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
                    padding-bottom: 5px; margin-bottom: 12px; border-bottom: 1.5px solid var(--ink); }
  .group h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .gcount { font-size: 13px; color: var(--pencil); white-space: nowrap; }
  .gcount.full { color: var(--accent); font-weight: 700; }
  .gcount.bad { color: var(--red); font-weight: 600; }
  .grid1 { display: grid; }
  .group.tek { flex: 1 1 auto; }

  /* Tekeningen per discipline: een kopje met een regel per document en een regel om toe te voegen */
  .discs { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .dsec { position: relative; background: var(--sheet); border: 1px solid #1b243040; display: flex; flex-direction: column; min-width: 0; }
  .dsec.none { background: #ffffffb0; border: 1.5px dashed #1b243070; }
  .disc-head { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px 6px; border-bottom: 1px solid var(--rule); }
  .dsec.none .disc-head { border-bottom: 0; }
  .disc-head h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--pencil); }
  .dcount { margin-left: auto; font-size: 13px; color: var(--pencil); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dcount.bad { color: var(--red); font-weight: 600; }
  .doclist { list-style: none; margin: 0; padding: 0; }
  .doc { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) 26px; align-items: center; gap: 4px 10px;
         padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--rule); box-shadow: inset 4px 0 0 var(--accent); }
  .doc.inherited { box-shadow: inset 4px 0 0 #135f80cc; }
  .doc.warned { box-shadow: inset 4px 0 0 var(--red); }
  .doc.plotting { box-shadow: inset 4px 0 0 var(--accent-soft); }
  .ro .doc { grid-template-columns: 40px minmax(0, 1fr); }
  .doc:not(.ro):hover { background: #f8fbfc; }
  .doc svg { width: 40px; height: 22px; }
  .doc-main { min-width: 0; display: flex; flex-direction: column; }
  .doc .fn { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { display: flex; gap: 8px; font-size: 12px; color: var(--pencil); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .doc-meta .got { font-weight: 600; color: var(--accent); }
  .doc-meta .hint { text-decoration: underline; text-underline-offset: 3px; }
  .doc:hover .hint { color: var(--accent); }
  .doc .namewarn { margin: 2px 0 0; }
  .rm { position: relative; z-index: 2; }
  .rm { width: 26px; height: 26px; font: 600 16px var(--head); line-height: 1; color: var(--pencil); background: none; border: 1px solid transparent; cursor: pointer; }
  .rm:hover { color: var(--red); border-color: #b3261e55; }
  .addrow { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; overflow: hidden;
            color: var(--accent); font-size: 14px; font-weight: 600; border-top: 1px dashed transparent; }
  .addrow small { font-weight: 400; color: var(--pencil); font-size: 13px; }
  .addrow .plus { display: grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid var(--accent); font-size: 16px; line-height: 1; }
  .addrow:hover, .addrow.over { background: var(--accent-tint); }
  .addrow.over { box-shadow: inset 0 0 0 2px var(--accent); }
  .dsec.none .addrow { padding: 4px 12px 12px; }
  .addrow.plotting, .doc.plotting { color: var(--accent); }
  .addrow:focus-within, .doc:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
  .doc .carriage, .addrow .carriage { top: 4px; bottom: 4px; }
  .doc.plotting .carriage, .addrow.plotting .carriage { opacity: 1; }
  .undo-line { margin: 0; padding: 0 12px; font-size: 13px; min-height: 0; }
  .undo-line:not(:empty) { padding: 6px 12px; border-top: 1px solid var(--rule); }
  .undo-line button { font: 600 12px var(--head); color: var(--accent); border: 1px solid var(--accent); background: none; cursor: pointer; padding: 1px 7px; margin-left: 8px; }
  .stack { display: inline-flex; align-items: center; gap: 2px; }
  .stack .mark { width: 9px; height: 14px; }
  .stack b { margin-left: 5px; font: 600 13px var(--mono); }
  .register .d { width: 74px; text-align: left; }
  .meter .mg { display: flex; gap: 2px; padding-right: 8px; margin-right: 6px; border-right: 1px solid var(--rule); }
  .meter .mg:last-child { border-right: 0; }
  .meter .mg i { width: 12px; }

  /* Controlerondes: tabbladen boven de werkbank, ze bepalen alles eronder */
  .rounds { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: -4px 0 18px; }
  .rounds-label { font-size: 14px; font-weight: 600; color: var(--pencil); }
  .tabs { display: flex; border: 1px solid #1b243040; background: var(--sheet); }
  .tabs button { font: 600 14px var(--head); padding: 6px 14px; border: 0; border-right: 1px solid #1b243026;
                 background: none; color: var(--ink); cursor: pointer; }
  .tabs button:last-child { border-right: 0; }
  .tabs button:hover { background: var(--accent-tint); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .tabs small { font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .85; }
  .tabs .latest { font-weight: 400; font-size: 13px; margin-left: 6px; }
  .round-note { font-size: 14px; color: var(--pencil); }
  .round-note.warn { color: var(--red); }
  .readonly { display: flex; align-items: center; gap: 12px; margin: -8px 0 18px; padding: 7px 12px;
              background: var(--sheet); border: 1px solid #1b243040; border-left: 4px solid var(--ink); font-size: 14px; }
  .readonly button { font: 600 14px var(--head); color: var(--accent); background: none; border: 0; padding: 2px 0;
                     text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* Blokken: upload-slots per discipline */
  .sheet { position: relative; width: var(--sq); height: var(--sq); display: flex; flex-direction: column; padding: 10px 12px;
           overflow: hidden; border: 1.5px dashed #1b243070; background: #ffffffb0; transition: border-color .15s, background .15s; }
  .grid1 .sheet { height: calc(var(--sq) * 2 + 14px); width: calc((var(--sq) * 2 + 14px) * .72); }
  .sheet.empty:hover, .sheet.over { border-color: var(--ink); background: var(--sheet); }
  .sheet.done:not(.ro):hover { border-color: var(--ink); }
  .sheet.over { border-style: solid; box-shadow: inset 0 0 0 3px var(--accent-tint); }
  .sheet.done { border-style: solid; border-color: #1b243040; background: var(--sheet); box-shadow: inset 0 4px 0 var(--accent); }
  .sheet.done.inherited { box-shadow: inset 0 4px 0 #135f8055; }
  .sheet.done.warned { box-shadow: inset 0 4px 0 var(--red); }
  .sheet.plotting { border-style: solid; border-color: var(--accent); background: var(--sheet); }
  .sheet.ro.empty { background: transparent; }
  .sheet:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sheet-head { display: flex; align-items: baseline; gap: 7px; }
  .code { font-family: var(--mono); font-size: 21px; font-weight: 600; line-height: 1; }
  .dname { font-size: 14px; color: var(--pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet svg { flex: 1; width: 100%; min-height: 0; max-height: calc(var(--sq) * .34); margin: auto 0; }
  .grid1 .sheet svg { max-height: calc(var(--sq) * 1.05); }
  .sheet-foot { min-width: 0; font: 12px var(--mono); color: var(--pencil); white-space: nowrap; display: flex; gap: 6px; justify-content: space-between; }
  .sheet-foot .fn { overflow: hidden; text-overflow: ellipsis; }
  .empty .sheet-foot { font: 13px var(--head); white-space: normal; }
  .sheet.done .sheet-foot { color: var(--ink); }
  .sheet-foot.bad { color: var(--red); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; min-height: 24px;
          font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meta .got { font-weight: 600; color: var(--accent); }
  .meta .inh { color: var(--pencil); }
  .warned .meta .got { color: var(--ink); }
  .meta .hint { color: var(--pencil); text-decoration: underline; text-underline-offset: 3px; }
  .sheet.done:not(.ro):hover .hint { color: var(--accent); }
  .meta .undo, .namewarn button { position: relative; z-index: 2; font: 600 12px var(--head); background: none; cursor: pointer;
                                   min-height: 24px; padding: 1px 7px; }
  .meta .undo { color: var(--accent); border: 1px solid var(--accent); }
  .namewarn { margin: 0 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
              font-size: 13px; line-height: 1.3; color: var(--red); font-weight: 600; white-space: nowrap; }
  .namewarn button { color: var(--red); border: 1px solid var(--red); }
  .namewarn button:hover { background: #b3261e12; }
  .plotting .meta, .plotting .namewarn { visibility: hidden; }
  .cardwarn { margin: 0; font-size: 14px; color: var(--red); }
  .hit { position: absolute; inset: 0; cursor: pointer; }
  .hit input { position: absolute; width: 1px; height: 1px; opacity: 0; left: 0; top: 0; }

  .ghost path { fill: none; stroke: #1b243035; stroke-width: .8; stroke-dasharray: 1.6 2; }
  .ink path { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round;
              stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ink path.accent { stroke: var(--accent); }
  .ink:not(.drawn) path { visibility: hidden; }
  .ink.drawn path { stroke-dashoffset: 0;
                    transition: stroke-dashoffset calc(var(--dur, 1600ms) * .55) cubic-bezier(.5, 0, .3, 1)
                                calc(var(--i) * var(--dur, 1600ms) * .07); }
  .ink.static path { transition: none; }

  .carriage { position: absolute; top: 36px; bottom: 40px; left: 0; width: 2px; background: var(--accent);
              opacity: 0; pointer-events: none; }
  .carriage::before { content: ""; position: absolute; top: -6px; left: -5px; width: 12px; height: 6px; background: var(--accent); }
  .sheet.plotting .carriage { opacity: 1; }

  /* Projectdetail */
  .meter { display: flex; gap: 4px; margin-top: 8px; }
  .meter i { width: 26px; height: 10px; border: 1.5px solid #1b243080;
             background: repeating-linear-gradient(-45deg, transparent 0 3px, #1b24303a 3px 4px); }
  .meter i.ok { background: var(--accent); border-color: var(--accent); }
  .meter-label { font-size: 13px; color: var(--pencil); margin-top: 3px; }

  /* Analyses: los te starten */
  .runs { display: grid; gap: 14px; }
  .run { background: var(--sheet); border: 1px solid #1b243040; display: flex; flex-direction: column; }
  .run > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
                  padding: 7px 12px; background: var(--accent-tint); border-bottom: 1px solid #1b243026; }
  .run h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .state { font-size: 13px; font-weight: 600; color: var(--pencil); white-space: nowrap; }
  .state.busy, .state.done { color: var(--accent); }
  .state.stale { color: var(--red); }
  .run-body { padding: 9px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .run-body p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--pencil); }
  .reqs { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .reqs li { display: flex; gap: 7px; }
  .reqs .y { color: var(--accent); font-weight: 700; }
  .reqs .n { color: var(--pencil); }
  .run-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .run-foot .info { flex-basis: 100%; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .run-foot .info .was { color: var(--accent); font-weight: 600; }
  .run-foot .why { font-size: 13px; color: var(--pencil); }
  .run-foot .warn { flex-basis: 100%; font-size: 14px; color: var(--red); }
  .progress { flex: 1; min-width: 160px; }
  .progress .bar { height: 6px; background: var(--accent-tint); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .progress .step { display: flex; justify-content: space-between; font-size: 13px; color: var(--accent); margin-top: 3px; }

  .progress .bar.indet i, .agent .bar.indet i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .run-foot .info.expect { color: var(--pencil); }
  .bad { color: var(--red); font-weight: 600; }

<script>
const DISCIPLINES = [
  { key: 'SPO', name: 'Spoor' },
  { key: 'SVZ', name: 'Stroomvoorziening' },
  { key: 'CIV', name: 'Civiel' },
  { key: 'WSB', name: 'Wissels' },
  { key: 'BST', name: 'Bestek' },
];
const DRAWINGS = DISCIPLINES.filter(d => d.key !== 'BST');
const BESTEK = DISCIPLINES.find(d => d.key === 'BST');

// Per discipline een eigen lijntekening die "geplot" wordt. Paden met '!' krijgen de accentkleur.
const GLYPHS = {
  SPO: ['M2 44 C40 44 70 26 118 18', 'M2 54 C42 54 74 36 118 28', 'M14 40 L14 58', 'M30 40 L30 58',
        'M46 37 L48 55', 'M62 32 L65 50', 'M78 27 L82 45', 'M94 22 L98 40'],
  SVZ: ['M2 14 Q31 26 60 14 Q89 26 118 14', 'M2 22 H118', 'M30 20 V58', 'M90 20 V58', 'M24 58 H36', 'M84 58 H96',
        '!M57 26 L51 36 L58 36 L52 46'],
  CIV: ['M2 50 C24 40 40 56 62 46 S98 36 118 44', 'M2 38 C26 28 44 42 64 34 S100 24 118 30',
        'M2 26 C28 16 48 28 66 22 S102 12 118 16', 'M14 60 H106', '!M60 4 V62'],
  WSB: ['M2 26 H118', 'M2 36 H118', 'M40 36 C66 36 86 44 118 56', 'M52 26 C74 26 92 34 118 46', '!M40 36 L54 27'],
  BST: ['!M16 16 V176', 'M28 20 H96', 'M28 40 H124', 'M28 52 H116', 'M28 64 H120', 'M28 76 H80',
        'M28 96 H124', 'M28 108 H112', 'M28 120 H122', 'M28 132 H68', 'M28 152 H120', 'M28 164 H100'],
};
const VIEWBOX = { BST: '0 0 140 192' };

// Een project heeft controlerondes. Elke ronde = een complete set (tekeningen per discipline + bestek) met eigen analyse-runs.
// Per discipline kunnen meerdere tekeningen horen (bijv. verwijderen, aanbrengen, kabelplannen; per project verschillend);
// files.SPO enz. zijn daarom lijsten. Het bestek (files.BST) is één document.
// Een nieuwe ronde neemt de documenten van de vorige over ('from' = ronde waarin het bestand is aangeleverd);
// je vervangt alleen wat gewijzigd is. Oudere rondes zijn alleen-lezen, zodat oude resultaten bewaard blijven.
// 'uid' blijft gelijk als een document wordt vervangen, zodat een run "SPO-00034 vervangen" kan melden.
let uidSeq = 0;
const doc = (name, size, at, from) => ({ uid: ++uidSeq, name, size, at, from });
const day = (m, d, h = 9, min = 0) => new Date(2026, m - 1, d, h, min);
// Documenten zelf worden nooit gewijzigd (een wijziging = nieuw object met dezelfde uid), dus delen tussen rondes is veilig.
// '_edited' (iets verwijderd of verplaatst in deze ronde) gaat niet mee naar de volgende ronde.
const cloneFiles = files => Object.fromEntries(Object.entries(files).filter(([k]) => !k.startsWith('_'))
  .map(([k, v]) => [k, Array.isArray(v) ? [...v] : v]));

const r1 = (name, size) => doc(name, size, day(9, 2), 1);
const keerlusR1 = {
  SPO: [r1('P051-690-BO-HTM-IB-SPO-00031-REV00.pdf', 4420000),
        r1('P051-690-BO-HTM-IB-SPO-00034-REV00.pdf', 4810000),
        r1('P051-690-BO-HTM-IB-SPO-00035-REV00.pdf', 2950000)],
  SVZ: [r1('P051-690-BO-HTM-IB-SVZ-00036-REV00.pdf', 3920000)],
  CIV: [r1('P051-690-DO-HTM-IB-CIV-00017-REV00.pdf', 5870000),
        r1('P051-690-DO-HTM-IB-CIV-00018-REV00.pdf', 6080000)],
  WSB: [r1('P051-690-BO-HTM-IB-WSB-00013-REV00.pdf', 1310000),
        r1('P051-690-BO-HTM-IB-WSB-00014-REV00.pdf', 2770000),
        r1('P051-690-BO-HTM-IB-WSB-00015-REV00.pdf', 1290000),
        r1('P051-690-BO-HTM-IB-WSB-00016-REV00.pdf', 2830000)],
  BST: doc('P051-690-Bestek-v2.pdf', 1240000, day(9, 2), 1),
};
// Ronde 2: CIV-00018 vervangen door REV01 (zelfde uid, dus "vervangen").
const civR2 = { ...keerlusR1.CIV[1], name: 'P051-690-DO-HTM-IB-CIV-00018-REV01.pdf', size: 6150000, at: day(9, 9), from: 2 };
const projects = [
  { id: 'P051-690', number: 'P051-690', name: 'Keerlus Wateringseveld', place: 'Den Haag — tramlijn 17', created: day(8, 26),
    rounds: [
      { no: 1, created: day(9, 2), files: keerlusR1, runs: {} },
      { no: 2, created: day(9, 9), files: { ...cloneFiles(keerlusR1), CIV: [keerlusR1.CIV[0], civR2] }, runs: {} },
    ] },
  { id: 'P048-212', number: 'P048-212', name: 'Halte Leyenburg — herinrichting', place: 'Den Haag — tramlijnen 4, 6', created: day(10, 6),
    rounds: [{ no: 1, created: day(10, 8), runs: {}, files: {
      SPO: [doc('P048-212-DO-HTM-IB-SPO-00007-REV02.pdf', 3300000, day(10, 8), 1)],
      CIV: [doc('P048-212-DO-HTM-IB-CIV-00010-REV01.pdf', 4710000, day(10, 21), 1),
            doc('P048-212-DO-HTM-IB-CIV-00011-REV01.pdf', 5020000, day(10, 21), 1)],
      WSB: [doc('P048-212-DO-HTM-IB-SVZ-00009-REV00.pdf', 2410000, day(10, 22), 1)],
    } }] },
  { id: 'P053-104', number: 'P053-104', name: 'Keerspoor Delft Station', place: 'Delft — tramlijn 19', created: day(10, 27),
    rounds: [{ no: 1, created: day(10, 27), files: {}, runs: {} }] },
];
let draft = null;
let openDetail = null; // { project, node, paint } van de detailpagina die nu open staat

const app = document.getElementById('app');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const fmtDate = d => d.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtShort = d => d.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' });
const fmtTime = d => `${fmtDate(d)} ${d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}`;
// Lange bestandsnamen van voren inkorten: het eind (discipline, volgnummer, tekening-revisie) is het informatieve deel.
const tail = (s, n = 21) => s.length > n ? '…' + s.slice(-(n - 1)) : s;
const fmtSize = b => b >= 1e6 ? (b / 1e6).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' kB';

const latest = p => p.rounds.at(-1);
const viewIndex = p => p.view ?? p.rounds.length - 1;
const list = (files, k) => files[k] || [];
// Alle documenten van een ronde als [sleutel, document]; sleutel = "SPO|uid" of "BST|0".
const entries = files => [...DRAWINGS.flatMap(d => list(files, d.key).map(f => [`${d.key}|${f.uid}`, f])),
                          ...(files.BST ? [['BST|0', files.BST]] : [])];
const keyDisc = k => k.split('|')[0];
const nDrawings = files => DRAWINGS.reduce((n, d) => n + list(files, d.key).length, 0);
const nDiscs = files => DRAWINGS.filter(d => list(files, d.key).length).length;
const nDocs = files => entries(files).length;
// Korte naam van een tekening: het tekeningnummer uit de bestandsnaam ("SPO-00034"), anders het eind van de naam.
const docNo = f => f.name.toUpperCase().match(/(SPO|SVZ|CIV|WSB)-\d{3,5}/)?.[0] || tail(f.name, 18);
const keyLabel = (k, f) => keyDisc(k) === 'BST' ? 'bestek' : docNo(f);
// In een regel: vanaf het tekeningnummer ("SPO-00031-REV00.pdf"); de volledige naam staat in de tooltip.
const shortName = f => f.name.match(/(SPO|SVZ|CIV|WSB)-\d{3,5}.*$/i)?.[0] || tail(f.name, 30);
const lastChange = p => new Date(Math.max(p.created, ...p.rounds.flatMap(r => [r.created, ...entries(r.files).map(([, f]) => f.at)])));

// Controle: past de disciplinecode in de bestandsnaam bij het vak? Alleen een waarschuwing, geen blokkade.
function nameCheck(key, name) {
  const codes = [...name.toUpperCase().matchAll(/(?:^|[^A-Z])(SPO|SVZ|CIV|WSB)(?=[^A-Z]|$)/g)].map(m => m[1]);
  const looksBestek = /bestek/i.test(name);
  if (key === 'BST') return codes.length && !looksBestek ? { msg: `Lijkt ${codes[0]}`, target: codes[0] } : null;
  if (looksBestek && !codes.length) return { msg: 'Lijkt bestek', target: 'BST' };
  if (codes.length && !codes.includes(key)) return { msg: `Lijkt ${codes[0]}`, target: codes[0] };
  return null;
}
const warnedDocs = files => entries(files).filter(([k, f]) => nameCheck(keyDisc(k), f.name));
const warnings = files => DISCIPLINES.filter(d => warnedDocs(files).some(([k]) => keyDisc(k) === d.key));

const ANALYSES = {
  tek: {
    title: 'Tekeninganalyse',
    desc: 'Vergelijkt de disciplinetekeningen onderling. Kan zonder bestek.',
    start: 'Start tekeninganalyse',
    reqs: files => [{ ok: nDrawings(files) >= 2, text: `Minimaal 2 tekeningen (${nDrawings(files)} aangeleverd)`, short: '2 tekeningen' }],
    inputs: files => entries(files).filter(([k]) => keyDisc(k) !== 'BST'),
    steps: ['Tekeningen inlezen', 'Lagen herkennen', 'Georefereren', 'Tekeningen vergelijken', 'Bevindingen samenstellen'],
  },
  bst: {
    title: 'Bestekanalyse',
    desc: 'Toetst de tekeningen aan de eisen in het bestek. Vereist het bestek.',
    start: 'Start bestekanalyse',
    reqs: files => [
      { ok: !!files.BST, text: 'Bestek aangeleverd', short: 'bestek' },
      { ok: nDrawings(files) >= 1, text: `Minimaal 1 tekening (${nDrawings(files)} aangeleverd)`, short: '1 tekening' },
    ],
    inputs: files => entries(files),
    steps: ['Bestek inlezen', 'Eisen en verwijzingen extraheren', 'Tekeningen koppelen', 'Toetsen', 'Bevindingen samenstellen'],
  },
};
// Een run onthoudt welke bestanden hij gebruikte; wijkt de ronde daarna af, dan is hij verouderd.
const snapshot = (files, kind) => Object.fromEntries(ANALYSES[kind].inputs(files));
function changesSince(run, files, kind) {
  const now = snapshot(files, kind), was = run.used;
  return [
    ...Object.keys(now).filter(k => !(k in was)).map(k => `${keyLabel(k, now[k])} nieuw`),
    // Vervangen = ander bestand (naam of tijdstip).
    ...Object.keys(now).filter(k => k in was && (was[k].name !== now[k].name || +was[k].at !== +now[k].at)).map(k => `${keyLabel(k, now[k])} vervangen`),
    ...Object.keys(was).filter(k => !(k in now)).map(k => `${keyLabel(k, was[k])} weg`),
  ];
}
/* ---------- Analyse-simulatie ----------
   Eerlijk over wat in het echt meetbaar is (zie skill analysis-screen):
   deel 1 (inlezen, lagen, over elkaar leggen) is telbaar en goed te voorspellen → echt % en, pas na enkele
   stappen, een resterende tijd. Deel 2 (één AI-beoordeling per afwijking) heeft een bekend aantal items maar
   een onvoorspelbare duur per item → teller + bandbreedte op basis van gemeten tijden. Geen totaal-%.
   De demo loopt SPEED× versneld; alle getoonde tijden zijn gesimuleerde tijden. */
const SPEED = 18;
const ERNST = ['Hoog', 'Midden', 'Laag'];
const PARTS = {

const PLURAL = { tekening: 'tekeningen', laagpaar: 'laagparen', pagina: "pagina's", bestekpost: 'bestekposten', bevinding: 'bevindingen', afwijking: 'afwijkingen', item: 'items' };
const plural = (n, unit) => `${n} ${n === 1 ? unit : PLURAL[unit] || unit}`;

// Bevindingen van de demo (zelfde lijst als bevindingen.html / demo/demo_bevindingen_v2.xlsx). [id, analyse, ernst, discipline, tekeningen, bestekspost, bevinding]

  ["K11", "tek", "Midden", "WSB/SVZ", "WSB-00014, WSB-00016, SVZ-00036", "725020, 725030, 730010", "Mastaarding M7469: WSB-00014 tekent hem als te verwijderen en WSB-00016 als nieuw met overspanningsbeveiliging; SVZ-00036 en het bestek verwijderen aarde/overspanningsafleider alleen bij M7468."],
  ["K12", "bst", "Midden", "WSB", "WSB-00014, WSB-00016", "615140, 624280", "Twee posten verwijzen naar een ander wissel: kortsluiter '16,2 meter vanaf punttong Wissel 67' en kabel naar 'zendertrafo HFE55S W117'. Dit project betreft wissel 634."],
  ["K13", "bst", "Midden", "WSB", "WSB-00016", "625230, 626130, 626110", "Twee posten laten aanbrengen 'zoals aangegeven op' tekeningen van andere projecten (P051-015-…-WSB-00016 en P061-015-…-WSB-00058); post 626110 verwijst naar een niet-bestaande post 617110."],
  ["P10", "tek", "Laag", "WSB", "WSB-00013", "", "Kabel (d) staat twee keer op het verwijderschema (vanaf M7468 én M7469), maar één keer in de kabeltabel ('(d) NEOPREEN 1x50mm², 5 m')."],
];

// In ronde 2 nieuw (bij CIV-00018 REV01, verzonnen voor de demo); de rest stond er in ronde 1 ook al.
const NEW_IN_R2 = { tek: ['P08'], bst: ['C06'] };
const CODES = {
  tek: ['WIS0634', 'KBL-SVZ-02', 'FUND-WK', 'BALLAST', 'OPSLUITBAND', 'SEIN-HSW', 'GRASBAAN', 'MAST-7468', 'KAST-W634',
        'STOPSTREEP', 'ZANDVANG', 'TBEF-1250', 'DWARSLIGGER', 'KABELROUTE', 'STROOMRAIL', 'WIS0635', 'VOEDING', 'TITELBLAD'],
  bst: ['412410', '625320', '221110', '231130', '615110', '620510', '715010', '624212', '131120', '141110', '412112', '716010', '622030', '624280'],
};
const TEMPLATES = {
  tek: [
    (c, a, b, R) => `${c}: ligging wijkt ${4 + Math.floor(R() * 30)} cm af tussen ${a} en ${b}.`,
    (c, a, b) => `${c} staat op ${a}, maar ontbreekt op ${b}.`,
    (c, a, b, R) => `${c}: maatvoering op ${a} (${600 + Math.floor(R() * 40) * 25} mm) wijkt af van ${b}.`,
    (c, a) => `${c}: ${a} verwijst naar een tekening die niet is aangeleverd.`,
  ],
  bst: [
    (c, a) => `Post ${c}: hoeveelheid in het bestek wijkt af van tekening ${a}.`,
    (c, a) => `Post ${c}: verwijst naar een ${a}-tekening die niet is aangeleverd.`,
    (c, a) => `Post ${c}: omschrijving past niet bij wat ${a} toont.`,
  ],
};

// Kleine deterministische random-generator, zodat voorbeeldprojecten bij elke keer laden hetzelfde ogen.
function rng(seed) {
  let h = 1779033703 ^ String(seed).length;
  for (const c of String(seed)) { h = Math.imul(h ^ c.charCodeAt(0), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const pick = (R, list) => list[Math.floor(R() * list.length)];
const discName = k => DISCIPLINES.find(d => d.key === k)?.name || k;

function synth(R, p, kind, code, a, b, i, opt = {}) {
  return { key: `${p.id}-${kind}-${code}-${i}`, id: '', ernst: opt.ernst || (R() < .2 ? 'Hoog' : R() < .6 ? 'Midden' : 'Laag'),
           disc: b && kind === 'tek' ? `${a}/${b}` : a, tek: '', text: pick(R, TEMPLATES[kind])(code, a, b || a, R),
           from: 1, gone: opt.gone ?? (R() < .3 ? 2 + Math.floor(R() * 2) : 99) };
}

// Alle mogelijke afwijkingen (items voor deel 2) per project en analyse, met hun bevindingen per ronde.
function pool(p, kind) {
  p.pool ??= {};
  if (p.pool[kind]) return p.pool[kind];
  const R = rng(p.id + kind);
  const codes = CODES[kind];
  let items;
  if (p.id === 'P051-690') {
    const real = KEERLUS_FINDINGS.filter(f => f[1] === kind).map(([id, , ernst, disc, tek, post, text]) =>
      ({ key: id, id, ernst, disc, tek: tek === '-' ? '' : tek, post, text, from: NEW_IN_R2[kind].includes(id) ? 2 : 1, gone: 99 }));
    const groups = new Map();
    real.forEach((f, i) => {
      const g = kind === 'tek' ? f.tek.split(', ').sort().join() : 'g' + Math.floor(i / 3);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(f);
    });
    items = [...groups.values()].map((fs, i) => ({
      code: kind === 'tek' ? codes[i % codes.length] : (fs.map(f => f.post.match(/\d{6}/)?.[0]).find(Boolean) || codes[i % codes.length]),
      label: kind === 'tek' ? (fs[0].tek || 'algemeen').replace(/, /g, ' × ') : [...new Set(fs.map(f => f.disc))].join(' · '),
      findings: fs,
    }));
    // Ronde 1 had nog bevindingen die met CIV REV01 zijn opgelost (verzonnen voor de demo).
    for (let i = 0; i < (kind === 'tek' ? 8 : 5); i++) {
      const it = items[(i * 3) % items.length];
      it.findings.push(synth(R, p, kind, it.code, 'CIV', kind === 'tek' ? 'WSB' : '', 'r1-' + i, { gone: 2, ernst: i % 3 ? 'Laag' : 'Midden' }));
    }
    items.push({ code: codes.at(-1), label: kind === 'tek' ? 'Titelblokken' : 'Algemeen', findings: [] },
               { code: codes.at(-2), label: kind === 'tek' ? 'Spoor × Wissels' : 'Wissels', findings: [] });
  } else {
    const files = latest(p).files;
    const present = DRAWINGS.filter(d => list(files, d.key).length).map(d => d.key);
    const keys = present.length >= 2 ? present : DRAWINGS.map(d => d.key);
    const pairs = keys.flatMap((a, i) => keys.slice(i + 1).map(b => [a, b]));
    items = Array.from({ length: 9 + Math.floor(R() * 5) }, (_, i) => {
      const [a, b] = kind === 'tek' ? pairs[i % pairs.length] : [pick(R, keys)];
      const code = codes[i % codes.length];
      const nF = R() < .25 ? 0 : 1 + Math.floor(R() * 3);
      return { code, label: kind === 'tek' ? `${discName(a)} × ${discName(b)}` : discName(a),
               findings: Array.from({ length: nF }, (_, j) => synth(R, p, kind, code, a, b, j)) };
    });
  }
  return p.pool[kind] = items;
}

// Draaiboek van één run: wanneer (in gesimuleerde ms) elke stap, elk item en elke regel in het logboek valt.
function buildPlan(p, ri, kind, opt = {}) {
  const r = p.rounds[ri];
  const R = rng(`${p.id}${kind}${r.no}${opt.salt ?? Math.random()}`);
  const span = (a, b) => (a + R() * (b - a)) * 1000;
  const used = opt.retryOf ? opt.retryOf.used : snapshot(r.files, kind);
  const drawings = Object.entries(used).filter(([k]) => keyDisc(k) !== 'BST').map(([, f]) => docNo(f));
  const n = drawings.length;
  const plan = { kind, round: r.no, used, steps: [], units: [], items: [], agent: [], log: [], T1: 0, retryOf: opt.retryOf };
  const log = (t, text, warn) => plan.log.push({ t, text, warn: !!warn });
  const current = pool(p, kind).map(it => ({ ...it, findings: it.findings.filter(f => f.from <= r.no && r.no < f.gone) }));
  let t = 0;

  if (opt.retryOf) {
    const codes = opt.retryOf.failed.map(f => f.code);
    plan.items = current.filter(it => codes.includes(it.code)).map(it => ({ ...it, foundAt: 0 }));
    log(0, `Opnieuw proberen: ${plural(plan.items.length, PARTS[kind].ai)}`);
  } else {
    const P = kind === 'tek' ? n * (n - 1) / 2 * 6 + Math.round(R() * n) : 64;
    // w = vaste kosten per eenheid (in het echt te kalibreren); daarop is het % van deel 1 gebaseerd.
    plan.steps = kind === 'tek' ? [
      { name: 'Tekeningen inlezen', unit: 'tekening', labels: drawings, w: 6, durs: drawings.map(() => span(4, 8)) },
      { name: 'Lagen en georeferentie', unit: 'tekening', labels: drawings, w: 10, varies: true,
        durs: drawings.map(() => R() < .3 ? span(16, 26) : span(6, 12)) },
      { name: 'Lagen over elkaar leggen', unit: 'laagpaar', w: 2.4, eta: true, durs: Array.from({ length: P }, () => span(1.6, 3.2)) },
    ] : [
      { name: 'Bestek inlezen', unit: 'pagina', w: .7, durs: Array.from({ length: 84 }, () => span(.4, 1)) },
      { name: 'Tekeningen inlezen', unit: 'tekening', labels: drawings, w: 6, durs: drawings.map(() => span(4, 8)) },
      { name: 'Tekeningverwijzingen zoeken', unit: 'bestekpost', w: 1, eta: true, durs: Array.from({ length: P }, () => span(.6, 1.4)) },
    ];
    log(0, `Gestart · ronde ${r.no} · ${kind === 'tek' ? plural(n, 'tekening') : 'bestek en ' + plural(n, 'tekening')}`);
    plan.steps.forEach((s, si) => {
      s.durs.forEach((d, ui) => {
        plan.units.push({ si, t0: t, t1: t += d });
        if (s.varies && d > 15000) log(t, `${s.labels[ui]}: tekstherkenning (OCR) traag, ${Math.round(d / 1000)} s`, true);
      });
      log(t, `${s.name} gereed (${plural(s.durs.length, s.unit)})`);
    });
    plan.T1 = t;
    const lastUnits = plan.units.filter(u => u.si === plan.steps.length - 1);
    const k = Math.min(current.length, lastUnits.length);
    plan.items = current.slice(0, k).map((it, i) =>
      ({ ...it, foundAt: lastUnits[Math.min(lastUnits.length - 1, Math.floor((i + R() * .9) * lastUnits.length / k))].t1 }));
    plan.items.forEach(it => log(it.foundAt, kind === 'tek'
      ? `Afwijking: ${it.code} · ${it.label} (overlap ${(.45 + R() * .3).toFixed(2).replace('.', ',')})`
      : `Post ${it.code} verwijst naar een tekening`));
    const nFail = opt.fail ?? (R() < .4 ? 1 : 0);
    if (nFail && plan.items.length) {
      const empty = plan.items.filter(i => !i.findings.length);
      (opt.fail !== undefined && empty.length ? pick(R, empty) : pick(R, plan.items)).fail = true;
    }
  }
  plan.items.forEach(it => {
    it.dur = it.fail ? 90000 : R() < .12 ? span(55, 85) : span(6, 38);
    it.t0 = t; it.t1 = t += it.dur;
    log(t, it.fail ? `${it.code}: beoordeling mislukt (time-out na 90 s)`
      : `${it.code} beoordeeld · ${it.findings.length ? plural(it.findings.length, 'bevinding') : 'geen bevinding'}`, it.fail);
  });
  const nA = plan.items.length ? 3 + Math.floor(R() * 3) : 0;
  for (let i = 0; i < nA; i++) plan.agent.push({ t0: t, t1: t += span(3, 8) });
  plan.T = t;
  if (nA) log(t, `Bevindingen samengesteld (${plan.items.filter(i => !i.fail).flatMap(i => i.findings).length})`);
  plan.log.sort((a, b) => a.t - b.t);
  return plan;
}

function record(plan, at) {
  const findings = plan.items.filter(i => !i.fail).flatMap(i => i.findings);
  const failed = plan.items.filter(i => i.fail).map(i => ({ code: i.code, label: i.label }));
  const last = plan.steps.at(-1);
  return { at, used: plan.used, findings, count: findings.length, failed, status: failed.length ? 'warn' : 'done',
           ms: plan.T, p1: { n: last.durs.length, unit: last.unit, ms: plan.T1 }, nItems: plan.items.length, log: plan.log };
}

const runKey = (r, kind) => `${r.no}:${kind}`;
const analysisHash = (p, r, kind) => `#/project/${encodeURIComponent(p.id)}/r${r.no}/${kind}`;
const vNow = live => Math.min(live.plan.T, (performance.now() - live.t0) * SPEED);

// De run-status leeft in de data (p.live), zodat hij navigatie en re-renders overleeft.
function startRun(p, ri, kind, retryOf) {
  const r = p.rounds[ri], key = runKey(r, kind);
  const plan = buildPlan(p, ri, kind, retryOf ? { retryOf } : {});
  delete p.cancelled[key];
  const live = p.live[key] = { plan, t0: performance.now() };
  live.timer = setTimeout(() => finishRun(p, ri, kind), plan.T / SPEED);
}
function finishRun(p, ri, kind) {
  const r = p.rounds[ri], key = runKey(r, kind), live = p.live[key];
  if (!live) return;
  delete p.live[key];
  const { plan } = live;
  if (plan.retryOf) {
    const run = plan.retryOf, offset = run.ms;
    run.findings.push(...plan.items.filter(i => !i.fail).flatMap(i => i.findings));
    run.failed = plan.items.filter(i => i.fail).map(i => ({ code: i.code, label: i.label }));
    run.count = run.findings.length;
    run.status = run.failed.length ? 'warn' : 'done';
    run.ms += plan.T;
    run.log = [...run.log, ...plan.log.map(e => ({ ...e, t: e.t + offset }))];
  } else {
    (r.runs[kind] ??= []).push(record(plan, new Date()));
  }
  if (location.hash !== analysisHash(p, r, kind)) p.unseen[key] = true;
  if (openDetail?.project === p && openDetail.node.isConnected) openDetail.paint();
  else if (!location.hash || location.hash === '#/') renderRegister();
}
function cancelRun(p, ri, kind) {
  const r = p.rounds[ri], key = runKey(r, kind), live = p.live[key];
  if (!live) return;
  clearTimeout(live.timer);
  p.cancelled[key] = { at: new Date(), v: vNow(live), retry: !!live.plan.retryOf };
  delete p.live[key];
}

// Korte voortgangsregel voor de analysekaart (zonder tijdsband: die hoort op het analysescherm).
function liveLine(plan, v) {
  const P = PARTS[plan.kind];
  if (v < plan.T1) return { text: `${P.p1} · ${p1Pct(plan, v)}%`, frac: p1Pct(plan, v) / 100 };
  const k = plan.items.filter(i => i.t1 <= v).length;
  if (k < plan.items.length) return { text: `${P.p2} · ${k} van ${plan.items.length}`, frac: k / plan.items.length };
  return { text: 'Bevindingen samenstellen', frac: null };
}
function p1Pct(plan, v) {
  const total = plan.steps.reduce((s, x) => s + x.w * x.durs.length, 0);
  const done = plan.units.filter(u => u.t1 <= v).reduce((s, u) => s + plan.steps[u.si].w, 0);
  return Math.floor(done / total * 100);
}

projects.forEach(p => { p.live = {}; p.unseen = {}; p.cancelled = {}; });

document.querySelectorAll('[data-z]').forEach(z => {

document.getElementById('tb-date').textContent = fmtDate(new Date());

function setSheet(title, nr, nav) {
