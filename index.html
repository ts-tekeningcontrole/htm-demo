function glyph(key, drawn) {
  const paths = GLYPHS[key].map(p => ({ accent: p[0] === '!', d: p.replace('!', '') }));
  return `<svg viewBox="${VIEWBOX[key] || '0 0 120 64'}" aria-hidden="true">
    <g class="ghost">${paths.map(p => `<path d="${p.d}"/>`).join('')}</g>
    <g class="ink${drawn ? ' drawn static' : ''}">${paths.map((p, i) =>
      `<path pathLength="1" style="--i:${i}"${p.accent ? ' class="accent"' : ''} d="${p.d}"/>`).join('')}</g>
  </svg>`;
}

// Mockup-upload: alleen naam en grootte worden bewaard (in het geheugen); de inhoud wordt nooit gelezen.
// Klikken of slepen op een gevuld blok vervangt het bestand in deze ronde (met "ongedaan maken").
// ctx = { round, readOnly, onChange, rerender, undo }
function sheet(files, d, ctx) {
  const f = files[d.key];
  const warn = f ? nameCheck(d.key, f.name) : null;
  // Alleen het bestek gebruikt dit blok nog; een verkeerd geplaatste tekening gaat naar de lijst van die discipline.
  const canMove = warn && !ctx.readOnly && warn.target !== 'BST';
  const inherited = f && f.from < ctx.round;
  const meta = !f ? '' : ctx.undo
    ? `<span class="got">Vervangen</span><button type="button" class="undo">Ongedaan maken</button>`
    : `${inherited ? `<span class="inh">Ronde ${f.from} · ${fmtShort(f.at)}</span>`
         : `<span class="got">Nieuw · ${fmtShort(f.at)}</span>`}
       ${ctx.readOnly ? '' : '<span class="hint" aria-hidden="true">vervangen</span>'}`;
  const node = el(`<div class="sheet ${f ? 'done' : 'empty'}${warn ? ' warned' : ''}${inherited ? ' inherited' : ''}${ctx.readOnly ? ' ro' : ''}">
    <div class="sheet-head"><span class="code">${d.key}</span><span class="dname">${d.name}</span></div>
    ${glyph(d.key, !!f)}
    ${warn ? `<p class="namewarn"><span title="De bestandsnaam wijst op een ander vak dan ${d.key}">⚠ ${esc(warn.msg)}</span>${canMove
      ? `<button type="button" data-move="${warn.target}" aria-label="Verplaats naar vak ${warn.target}">Naar ${warn.target}</button>` : ''}</p>` : ''}
    <div class="sheet-foot" aria-live="polite">${f
      ? `<span class="fn" title="${esc(f.name)} · ${fmtSize(f.size)}">${esc(tail(f.name))}</span>`
      : `<span class="fn">${ctx.readOnly ? 'Niet aangeleverd in deze ronde' : 'Klik of sleep een PDF hierheen'}</span>`}</div>
    ${f ? `<div class="meta">${meta}</div>` : ''}
    <i class="carriage" aria-hidden="true"></i>
    ${ctx.readOnly ? '' : `<label class="hit"><span class="sr">${f ? `Vervang ${d.name} (nu: ${esc(f.name)})` : `Kies PDF voor ${d.name}`}</span>
      <input type="file" accept="application/pdf,.pdf"></label>`}
  </div>`);
  if (ctx.readOnly) return node;

  const input = node.querySelector('.hit input');
  const foot = node.querySelector('.sheet-foot');
  const redraw = (undo, focus) => {
    const fresh = sheet(files, d, { ...ctx, undo });
    node.replaceWith(fresh);
    if (focus) (fresh.querySelector('.undo') || fresh.querySelector('.hit input')).focus();
    ctx.onChange?.();
    return fresh;
  };

  node.querySelector('[data-move]')?.addEventListener('click', e => {
    const t = e.currentTarget.dataset.move;
    files[t] = [...list(files, t), { ...files[d.key], uid: ++uidSeq }];
    delete files[d.key];
    ctx.rerender();
  });
  node.querySelector('.undo')?.addEventListener('click', () => {
    if (ctx.undo.previous) files[d.key] = ctx.undo.previous; else delete files[d.key];
    redraw(null, true);
  });
  input.addEventListener('change', () => { if (input.files[0]) plot(input.files[0]); input.value = ''; });
  node.addEventListener('dragover', e => { e.preventDefault(); node.classList.add('over'); });
  node.addEventListener('dragleave', () => node.classList.remove('over'));
  node.addEventListener('drop', e => {
    e.preventDefault();
    node.classList.remove('over');
    if (e.dataTransfer.files[0]) plot(e.dataTransfer.files[0]);
  });

  function plot(upload) {
    if (node.classList.contains('plotting')) return;
    if (upload.type !== 'application/pdf' && !/\.pdf$/i.test(upload.name)) {
      const before = foot.innerHTML;
      foot.className = 'sheet-foot bad';
      foot.innerHTML = `<span class="fn">Alleen PDF — ${esc(upload.name)} geweigerd</span>`;
      setTimeout(() => { if (!node.classList.contains('plotting')) { foot.className = 'sheet-foot'; foot.innerHTML = before; } }, 3500);
      return;
    }
    node.classList.add('plotting');
    foot.className = 'sheet-foot';

    const ink = node.querySelector('.ink');
    const carriage = node.querySelector('.carriage');
    const dur = reduceMotion ? 250 : 1400 + Math.min(upload.size / 1e6 * 150, 1200);
    ink.classList.remove('drawn', 'static');
    ink.getBoundingClientRect();
    ink.style.setProperty('--dur', dur + 'ms');
    ink.classList.add('drawn');

    const start = performance.now();
    (function tick(now) {
      const t = Math.min(1, (now - start) / dur);
      const pct = Math.round(t * 100);
      carriage.style.left = `calc(${pct}% - ${pct * 0.02}px)`;
      foot.innerHTML = `<span class="fn">Inlezen · ${esc(upload.name)}</span><span>${pct}%</span>`;
      if (t < 1) return requestAnimationFrame(tick);
      const previous = files[d.key];
      files[d.key] = doc(upload.name, upload.size, new Date(), ctx.round);
      if (!node.isConnected) return;
      const hadFocus = node.contains(document.activeElement);
      const fresh = redraw(previous ? { previous } : null, hadFocus);
      // "Ongedaan maken" blijft even staan en verdwijnt daarna vanzelf.
      if (previous) setTimeout(() => { if (fresh.isConnected && fresh.querySelector('.undo')) redrawQuiet(fresh); }, 7000);
    })(start);
  }
  function redrawQuiet(current) {
    const fresh = sheet(files, d, { ...ctx, undo: null });
    const focus = current.contains(document.activeElement);
    current.replaceWith(fresh);
    if (focus) fresh.querySelector('.hit input').focus();
  }
  return node;
}

// Plotter-animatie op een regel: de wagen loopt over de regel terwijl het bestand "wordt ingelezen".
function plotRow(node, upload, label, done) {
  const carriage = node.querySelector('.carriage');
  const dur = reduceMotion ? 250 : 900 + Math.min(upload.size / 1e6 * 120, 900);
  node.classList.add('plotting');
  const start = performance.now();
  (function tick(now) {
    const t = Math.min(1, (now - start) / dur), pct = Math.round(t * 100);
    carriage.style.left = `calc(${pct}% - ${pct * 0.02}px)`;
    label.textContent = `Inlezen · ${upload.name} · ${pct}%`;
    if (t < 1) return requestAnimationFrame(tick);
    done();
  })(start);
}
const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);

// Eén regel per tekening: nummer en status in deze ronde. Klikken of slepen op de regel vervangt het bestand.
function docRow(files, d, f, ctx, section) {
  const warn = nameCheck(d.key, f.name);
  const inherited = f.from < ctx.round;
  const canMove = warn && !ctx.readOnly && (warn.target !== 'BST' || !files.BST);
  const status = inherited ? `<span>Ronde ${f.from} · ${fmtShort(f.at)}</span>` : `<span class="got">Nieuw · ${fmtShort(f.at)}</span>`;
  const node = el(`<li class="doc${inherited ? ' inherited' : ''}${warn ? ' warned' : ''}${ctx.readOnly ? ' ro' : ''}" data-uid="${f.uid}"${
    ctx.readOnly ? '' : ' title="Klik of sleep een PDF op deze regel om de tekening te vervangen"'}>
    ${glyph(d.key, true)}
    <div class="doc-main">
      <span class="fn" title="${esc(f.name)} · ${fmtSize(f.size)}">${esc(shortName(f))}</span>
      <span class="doc-meta" aria-live="polite">${status}${ctx.readOnly ? '' : '<span class="hint" aria-hidden="true">vervangen</span>'}</span>
      ${warn ? `<p class="namewarn"><span title="De bestandsnaam wijst op een andere discipline dan ${d.key}">⚠ ${esc(warn.msg)}</span>${canMove
        ? `<button type="button" data-move="${warn.target}" aria-label="Verplaats ${esc(docNo(f))} naar ${warn.target}">Naar ${warn.target}</button>` : ''}</p>` : ''}
    </div>
    ${ctx.readOnly ? '' : `<button type="button" class="rm" aria-label="Verwijder ${esc(docNo(f))} uit deze ronde" title="Verwijderen uit deze ronde">×</button>
      <label class="hit"><span class="sr">Vervang ${esc(f.name)}</span><input type="file" accept="application/pdf,.pdf"></label>`}
    <i class="carriage" aria-hidden="true"></i>
  </li>`);
  if (ctx.readOnly) return node;

  const replaceWith = upload => {
    if (!isPdf(upload)) return section.say(`Alleen PDF — ${upload.name} geweigerd`);
    plotRow(node, upload, node.querySelector('.doc-meta'), () => {
      const i = list(files, d.key).indexOf(f);
      const fresh = { ...doc(upload.name, upload.size, new Date(), ctx.round), uid: f.uid };
      files[d.key] = list(files, d.key).map((x, j) => j === i ? fresh : x);
      section.redraw({ text: `${docNo(f)} vervangen`, undo: () => { files[d.key] = list(files, d.key).map(x => x === fresh ? f : x); } });
    });
  };
  const input = node.querySelector('.hit input');
  input.addEventListener('change', () => { if (input.files[0]) replaceWith(input.files[0]); input.value = ''; });
  node.addEventListener('dragover', e => { e.preventDefault(); node.classList.add('over'); });
  node.addEventListener('dragleave', () => node.classList.remove('over'));
  node.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); node.classList.remove('over');
    const fs = e.dataTransfer.files;
    if (fs.length > 1) section.say(`Een regel vervangt één tekening — sleep meerdere PDF's op "Tekening toevoegen".`);
    else if (fs[0]) replaceWith(fs[0]);
  });

  node.querySelector('.rm').addEventListener('click', () => {
    const before = list(files, d.key), wasEdited = files._edited;
    files[d.key] = before.filter(x => x !== f);
    files._edited = true;
    section.redraw({ text: `${docNo(f)} verwijderd uit ronde ${ctx.round}`, undo: () => { files[d.key] = before; files._edited = wasEdited; } }, true);
  });
  node.querySelector('[data-move]')?.addEventListener('click', e => {
    const t = e.currentTarget.dataset.move;
    files[d.key] = list(files, d.key).filter(x => x !== f);
    files._edited = true;
    const moved = { ...f, uid: ++uidSeq };
    if (t === 'BST') files.BST = f; else files[t] = [...list(files, t), moved];
    ctx.rerender();
    // Laat zien waar de tekening is gebleven: melding in het doelkopje en focus op de verplaatste regel.
    const target = app.querySelector(`.dsec[aria-labelledby="h-${t}"]`);
    const msg = target?.querySelector('.undo-line');
    if (msg) { msg.textContent = `${docNo(f)} verplaatst van ${d.key} naar ${t}`; setTimeout(() => { if (msg.isConnected) msg.textContent = ''; }, 5000); }
    (target?.querySelector(`[data-uid="${moved.uid}"] .rm`) || app.querySelector('.grid1 .hit input'))?.focus();
  });
  return node;
}

// Een kopje per discipline met de lijst tekeningen en een regel om er (meerdere) toe te voegen.
// ctx = { round, readOnly, onChange, rerender }; undo = { text, undo } van de laatste wijziging in dit kopje.
function discSection(files, d, ctx, undo) {
  const docs = list(files, d.key);
  const node = el(`<section class="dsec${docs.length ? '' : ' none'}${ctx.readOnly ? ' ro' : ''}" aria-labelledby="h-${d.key}">
    <header class="disc-head"><span class="code">${d.key}</span><h3 id="h-${d.key}">${d.name}</h3><span class="dcount"></span></header>
    <ol class="doclist"></ol>
    ${ctx.readOnly ? (docs.length ? '' : '<p class="addrow"><small>Geen tekeningen in deze ronde</small></p>')
      : `<div class="addrow"><span class="plus" aria-hidden="true">+</span><span class="addlabel">Tekening toevoegen</span>
          <small class="addhint">${docs.length ? '' : "klik of sleep één of meer PDF's"}</small>
          <label class="hit"><span class="sr">Voeg ${d.name}-tekeningen toe</span><input type="file" accept="application/pdf,.pdf" multiple></label>
          <i class="carriage" aria-hidden="true"></i></div>`}
    <p class="undo-line" aria-live="polite"></p>
  </section>`);
  const line = node.querySelector('.undo-line');
  const section = {
    count() {
      const ds = list(files, d.key), bad = ds.filter(f => nameCheck(d.key, f.name)).length;
      const c = node.querySelector('.dcount');
      c.textContent = !ds.length ? 'nog geen tekening' : `${plural(ds.length, 'tekening')}${bad ? ` · ${bad} naamwaarschuwing` : ''}`;
      c.className = 'dcount' + (bad ? ' bad' : '');
    },
    say(text) { line.textContent = text; setTimeout(() => { if (line.textContent === text) line.textContent = ''; }, 4000); },
    redraw(change, focusUndo) {
      const fresh = discSection(files, d, ctx, change);
      // Kan intussen al opnieuw getekend zijn (twee acties tegelijk): vervang dan het kopje dat nu op de pagina staat.
      const current = node.isConnected ? node : app.querySelector(`.dsec[aria-labelledby="h-${d.key}"]`);
      current?.replaceWith(fresh);
      ctx.onChange?.();
      if (focusUndo) fresh.querySelector('.undo-line button')?.focus();
      return fresh;
    },
  };
  docs.forEach(f => node.querySelector('.doclist').append(docRow(files, d, f, ctx, section)));
  section.count();

  if (undo) {
    line.innerHTML = `${esc(undo.text)}<button type="button">Ongedaan maken</button>`;
    line.querySelector('button').addEventListener('click', () => { undo.undo(); section.redraw(null).querySelector('.addrow input')?.focus(); });
    setTimeout(() => {
      if (!line.isConnected || !line.querySelector('button')) return;
      const hadFocus = line.contains(document.activeElement);
      line.textContent = '';
      if (hadFocus) node.querySelector('.addrow input')?.focus(); // focus niet laten wegvallen naar de pagina
    }, 7000);
  }
  if (ctx.readOnly) return node;

  const add = node.querySelector('.addrow');
  const input = add.querySelector('input');
  const addFiles = uploads => {
    const ok = [...uploads].filter(isPdf), bad = [...uploads].filter(u => !isPdf(u));
    if (bad.length) section.say(`Alleen PDF — ${bad.map(u => u.name).join(', ')} geweigerd`);
    if (!ok.length) return;
    const total = { name: ok.length > 1 ? `${ok.length} bestanden` : ok[0].name, size: ok.reduce((s, u) => s + u.size, 0) };
    add.querySelector('.addhint').textContent = '';
    plotRow(add, total, add.querySelector('.addlabel'), () => {
      const added = ok.map(u => doc(u.name, u.size, new Date(), ctx.round));
      files[d.key] = [...list(files, d.key), ...added];
      const fresh = section.redraw(null);
      fresh.querySelector('.addrow input')?.focus();
    });
  };
  input.addEventListener('change', () => { if (input.files.length) addFiles(input.files); input.value = ''; });
  add.addEventListener('dragover', e => { e.preventDefault(); add.classList.add('over'); });
  add.addEventListener('dragleave', () => add.classList.remove('over'));
  add.addEventListener('drop', e => { e.preventDefault(); add.classList.remove('over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  return node;
}

// Tekeningen per discipline (kopjes met lijsten) + bestek rechts. Tellers in de groepskoppen werken bij na elke wijziging.
function documents(files, ctx) {
  const node = el(`<div class="docs">
    <section class="group tek" aria-labelledby="g-tek"><header><h2 id="g-tek">Tekeningen</h2><span class="gcount" data-g="tek"></span></header><div class="discs"></div></section>
    <section class="group" aria-labelledby="g-bst"><header><h2 id="g-bst">Bestek</h2><span class="gcount" data-g="bst"></span></header><div class="grid1"></div></section>
  </div>`);
  const refresh = () => {
    const n = nDrawings(files), nd = nDiscs(files);
    const tBad = warnedDocs(files).filter(([k]) => keyDisc(k) !== 'BST').length;
    const t = node.querySelector('[data-g="tek"]');
    t.textContent = tBad ? `${plural(n, 'tekening')} · ${tBad} naamwaarschuwing${tBad > 1 ? 'en' : ''}`
      : `${plural(n, 'tekening')} · ${nd} van 4 disciplines`;
    t.className = 'gcount' + (tBad ? ' bad' : nd === 4 ? ' full' : '');
    const b = node.querySelector('[data-g="bst"]');
    const bBad = files.BST && nameCheck('BST', files.BST.name);
    b.textContent = bBad ? 'naamwaarschuwing' : files.BST ? 'ontvangen' : 'ontbreekt';
    b.className = 'gcount' + (bBad ? ' bad' : files.BST ? ' full' : '');
  };
  const sctx = { ...ctx, onChange: () => { refresh(); ctx.onChange?.(); } };
  DRAWINGS.forEach(d => node.querySelector('.discs').append(discSection(files, d, sctx)));
  node.querySelector('.grid1').append(sheet(files, BESTEK, sctx));
  refresh();
  return node;
}

// Verwachte duur van deel 1 (vaste kosten per eenheid); deel 2 hangt af van het aantal afwijkingen.
function expectP1(files, kind) {
  const n = nDrawings(files);
  const s = kind === 'tek' ? n * 16 + (n * (n - 1) / 2 * 6) * 2.4 : 84 * .7 + n * 6 + 64;
  return Math.max(1, Math.round(s / 60));
}

function runCard(p, ri, kind, readOnly) {
  const a = ANALYSES[kind];
  const r = p.rounds[ri];
  const key = runKey(r, kind);
  const live = p.live[key];
  const last = r.runs[kind]?.at(-1);
  const cancelled = p.cancelled[key];
  const prevRound = p.rounds[ri - 1];
  const prevLast = prevRound?.runs[kind]?.at(-1);
  const reqs = a.reqs(r.files);
  const ready = reqs.every(x => x.ok);
  const reasons = last ? changesSince(last, r.files, kind) : [];
  const stale = reasons.length > 0;
  const dot = p.unseen[key] ? '<span class="dot" title="Nieuw resultaat, nog niet bekeken"></span><span class="sr">nieuw resultaat</span>' : '';
  const state = live ? ['busy', 'Bezig'] : cancelled && !last ? ['', 'Geannuleerd'] : stale ? ['stale', 'Verouderd']
    : last ? (last.status === 'warn' ? ['stale', 'Gereed met waarschuwingen'] : ['done', 'Gereed']) : ['', 'Niet gedraaid'];
  const missing = reqs.filter(x => !x.ok).map(x => x.short);
  const misnamed = [...new Set(a.inputs(r.files).filter(([k, f]) => nameCheck(keyDisc(k), f.name)).map(([k, f]) => keyLabel(k, f)))];
  const cardWarn = misnamed.length && !readOnly && !live
    ? `<p class="cardwarn">⚠ ${misnamed.join(', ')}: bestandsnaam past niet bij de discipline — controleer vóór het draaien.</p>` : '';
  const screen = analysisHash(p, r, kind);

  let foot;
  if (live) {
    foot = `<div class="progress" role="status"><div class="bar"><i></i></div><div class="step"><span></span></div></div>
      <a class="btn sm ghost" href="${screen}">Bekijk voortgang</a>`;
  } else {
    const delta = last && prevLast ? last.count - prevLast.count : 0;
    const was = last && prevLast ? ` <span class="was">· ${delta === 0 ? 'gelijk aan' : (delta < 0 ? '−' : '+') + Math.abs(delta) + ' t.o.v.'} ronde ${prevRound.no}</span>` : '';
    const failNote = last?.failed.length ? ` · <span class="bad">${plural(last.failed.length, 'item')} niet beoordeeld</span>` : '';
    const info = last ? `<span class="info"><b>${last.count} bevindingen</b>${was}${failNote} · ${fmtTime(last.at)}</span>`
      : readOnly ? `<span class="info">Niet gedraaid in deze ronde.</span>`
      : cancelled ? `<span class="info">Laatste poging geannuleerd na ${fmtDur(cancelled.v)}.</span>`
      : ready ? `<span class="info expect">Duur: ${PARTS[kind].p1.toLowerCase()} ca. ${expectP1(r.files, kind)} min, daarna enkele minuten AI-beoordeling.</span>` : '';
    const warn = stale && !readOnly ? `<span class="warn">Verouderd: ${esc(reasons.join(', '))} sinds de laatste run.</span>` : '';
    const view = last || cancelled ? `<a class="btn sm ghost" href="${screen}">${last ? 'Bekijk samenvatting' : 'Bekijk'}</a>${dot}` : '';
    if (readOnly) {
      foot = `${info}${view}`;
    } else {
      const label = last ? 'Opnieuw draaien' : a.start;
      const cls = last && !stale ? 'btn sm ghost' : 'btn sm';
      const why = ready ? '' : `<span class="why">Eerst nodig: ${esc(missing.join(', '))}</span>`;
      foot = `${info}${warn}<button class="${cls}" type="button" data-act="start"${ready ? '' : ' aria-disabled="true"'}>${label}</button>${view}${why}`;
    }
  }

  const node = el(`<article class="run">
    <header><h3>${a.title}</h3><span class="state ${state[0]}">${state[1]}</span></header>
    <div class="run-body">
      <p>${a.desc}</p>
      <ul class="reqs">${reqs.map(x => `<li><span class="${x.ok ? 'y' : 'n'}" aria-hidden="true">${x.ok ? '✓' : '✕'}</span>
        <span>${x.text}<span class="sr">: ${x.ok ? 'voldaan' : 'niet voldaan'}</span></span></li>`).join('')}</ul>
      ${cardWarn}
      <div class="run-foot">${foot}</div>
    </div>
  </article>`);

  node.querySelector('[data-act="start"]')?.addEventListener('click', e => {
    if (e.currentTarget.getAttribute('aria-disabled') === 'true') return;
    startRun(p, ri, kind);
    location.hash = screen;
  });

  if (live) {
    const bar = node.querySelector('.bar');
    const stepEl = node.querySelector('.step span');
    const tick = () => {
      if (!node.isConnected || p.live[key] !== live) return;
      const l = liveLine(live.plan, vNow(live));
      bar.classList.toggle('indet', l.frac == null);
      bar.firstElementChild.style.width = l.frac == null ? '' : (l.frac * 100).toFixed(1) + '%';
      stepEl.textContent = l.text;
      setTimeout(tick, 300);
    };
    setTimeout(tick); // pas na invoegen in de pagina
  }
  return node;
}

function renderRegister() {
  openDetail = null;
  setSheet('Projectregister', '01', 'register');
  const got = projects.reduce((n, p) => n + nDocs(latest(p).files), 0);
  const rows = [...projects].sort((a, b) => lastChange(b) - lastChange(a)).map(p => {
    const r = latest(p);
    const bad = warnings(r.files).map(d => d.key);
    return `
    <tr data-id="${esc(p.id)}">
      <td class="nr">${esc(p.number)}</td>
      <td class="pname"><a href="#/project/${encodeURIComponent(p.id)}">${esc(p.name)}</a><small>${esc(p.place || '—')}</small></td>
      ${DISCIPLINES.map(d => {
        const warn = bad.includes(d.key) ? ' warn' : '';
        if (d.key === 'BST') {
          const s = !r.files.BST ? 'ontbreekt' : warn ? 'ontvangen, naam wijkt af' : 'ontvangen';
          return `<td class="d"><span class="mark${r.files.BST ? ' ok' : ''}${warn}" title="${d.name}: ${s}"></span><span class="sr">${d.name}: ${s}</span></td>`;
        }
        // Eén blokje per tekening (max. 5 getekend), met het aantal erachter.
        const n = list(r.files, d.key).length;
        const s = !n ? 'geen tekeningen' : `${plural(n, 'tekening')}${warn ? ', naam wijkt af' : ''}`;
        return `<td class="d"><span class="stack" title="${d.name}: ${s}">${n
          ? Array.from({ length: Math.min(n, 5) }, () => `<span class="mark ok${warn}"></span>`).join('') + `<b>${n}</b>`
          : '<span class="mark"></span>'}</span><span class="sr">${d.name}: ${s}</span></td>`;
      }).join('')}
      <td class="count${nDiscs(r.files) === 4 && r.files.BST ? ' full' : ''}">${plural(nDrawings(r.files), 'tekening')}${r.files.BST ? ' + bestek' : ''}</td>
      <td class="count">Ronde ${r.no} <span class="date">· ${fmtShort(r.created)}</span>${
        Object.keys(p.live).length ? ' <span class="busy-s">· analyse bezig</span>' : ''}${
        Object.keys(p.unseen).length ? ' <span class="dot" title="Nieuw analyseresultaat, nog niet bekeken"></span><span class="sr">nieuw analyseresultaat</span>' : ''}</td>
      <td class="date">${fmtDate(lastChange(p))}</td>
      <td class="go" aria-hidden="true">→</td>
    </tr>`;
  }).join('');

  const view = el(`<section>
    <div class="view-head">
      <div><p class="label">Overzicht</p><h1>Projectregister</h1></div>
      <dl class="tally">
        <div><dt>Projecten</dt><dd>${projects.length}</dd></div>
        <div><dt>Documenten</dt><dd>${got}</dd></div>
      </dl>
      <a class="btn" href="#/nieuw">+ Nieuw project</a>
    </div>
    ${projects.length ? `<div class="tablewrap"><table class="register">
      <thead><tr><th>Nr.</th><th>Project</th>${DISCIPLINES.map(d => `<th class="d" title="${d.name}">${d.key}</th>`).join('')}
        <th>Aangeleverd</th><th>Controleronde</th><th>Gewijzigd</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="legend"><span><span class="mark ok"></span>één blokje per tekening (laatste ronde)</span><span><span class="mark"></span>ontbreekt</span>
        <span><span class="mark ok warn"></span>bestandsnaam past niet bij discipline</span>
        <span><span class="dot"></span>nieuw analyseresultaat</span></p>`
      : `<p class="empty">Nog geen projecten. Begin met "+ Nieuw project".</p>`}
  </section>`);
  view.querySelectorAll('tr[data-id]').forEach(tr =>
    tr.addEventListener('click', e => { if (!e.target.closest('a')) location.hash = '#/project/' + encodeURIComponent(tr.dataset.id); }));
  app.replaceChildren(view);
}

function renderNew() {
  openDetail = null;
  setSheet('Nieuw project', '02', 'nieuw');
  draft ??= { number: '', name: '', place: '', files: {} };
  const view = el(`<section>
    <div class="view-head">
      <div><p class="label">Invoer</p><h1>Nieuw project</h1></div>
      <span></span><a class="back" href="#/">← Terug naar register</a>
    </div>
    <form class="new" novalidate>
      <fieldset class="fields">
        <legend>Projectgegevens</legend>
        <label class="field"><span>Projectnummer</span>
          <input name="number" class="mono" placeholder="bijv. P051-690" autocomplete="off" value="${esc(draft.number)}"></label>
        <label class="field"><span>Projectnaam</span>
          <input name="name" placeholder="bijv. Keerlus Wateringseveld" autocomplete="off" value="${esc(draft.name)}"></label>
        <label class="field"><span>Locatie of omschrijving <em>(optioneel)</em></span>
          <input name="place" placeholder="bijv. Den Haag — tramlijn 17" autocomplete="off" value="${esc(draft.place)}"></label>
        <p class="err" role="alert"></p>
        <div><button class="btn" type="submit">Project aanmaken →</button></div>
        <p class="note">Demo: voeg per discipline één of meer PDF's toe (bijv. verwijder- en aanbrengtekening, kabelplannen). Er wordt niets opgeslagen of verstuurd. Dit wordt controleronde 1; documenten kun je ook later aanleveren.</p>
      </fieldset>
      <div class="docs-slot"></div>
    </form>
  </section>`);
  const form = view.querySelector('form');
  const err = view.querySelector('.err');
  view.querySelector('.docs-slot').replaceWith(documents(draft.files, { round: 1, readOnly: false, rerender: renderNew }));

  form.addEventListener('input', e => { if (e.target.name) draft[e.target.name] = e.target.value; });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const number = draft.number.trim().toUpperCase();
    const name = draft.name.trim();
    let problem = '', field = 'number';
    if (!number) problem = 'Vul een projectnummer in.';
    else if (!name) [problem, field] = ['Vul een projectnaam in.', 'name'];
    else if (projects.some(p => p.id === number)) problem = `Projectnummer ${number} bestaat al in het register.`;
    if (problem) {
      err.textContent = problem;
      form.elements[field].focus();
      return;
    }
    const now = new Date();
    projects.push({ id: number, number, name, place: draft.place.trim(), created: now, live: {}, unseen: {}, cancelled: {},
                    rounds: [{ no: 1, created: now, files: draft.files, runs: {} }] });
    draft = null;
    location.hash = '#/project/' + encodeURIComponent(number);
  });
  app.replaceChildren(view);
}

function renderDetail(p, note) {
  const ri = viewIndex(p);
  const r = p.rounds[ri];
  const cur = latest(p);
  const readOnly = ri < p.rounds.length - 1;
  // Een nieuwe ronde heeft pas zin als de huidige ronde zelf iets nieuws bevat (ronde 1 telt altijd).
  const curChanged = cur.no === 1 || cur.files._edited || entries(cur.files).some(([, f]) => f.from === cur.no);
  setSheet(`${p.name} — ronde ${r.no}`, p.number, null);

  const tabs = p.rounds.map((x, i) => `<button type="button" role="tab" data-r="${i}" aria-selected="${i === ri}">Ronde ${x.no}<small>${fmtShort(x.created)}</small>${
    i === p.rounds.length - 1 ? '<span class="latest">· actueel</span>' : ''}${
    Object.keys(p.unseen).some(k => k.startsWith(x.no + ':')) ? '<span class="dot" title="Nieuw analyseresultaat"></span>' : ''}</button>`).join('');
  const view = el(`<section>
    <div class="view-head">
      <div><p class="label"><span class="pnr">${esc(p.number)}</span> · ${esc(p.place || 'geen locatie')}</p><h1>${esc(p.name)}</h1></div>
      <div><div class="meter" aria-hidden="true"></div><div class="meter-label"></div></div>
      <a class="back" href="#/">← Terug naar register</a>
    </div>
    <div class="rounds">
      <span class="rounds-label" id="rl">Controleronde</span>
      <div class="tabs" role="tablist" aria-labelledby="rl">${tabs}</div>
      <button class="btn sm ghost" type="button" data-new${curChanged ? '' : ' aria-disabled="true"'}>+ Nieuwe ronde</button>
      <span class="round-note${note?.warn ? ' warn' : ''}" aria-live="polite">${note ? esc(note.text)
        : curChanged ? '' : `Vervang eerst gewijzigde documenten in ronde ${cur.no}.`}</span>
    </div>
    ${readOnly ? `<p class="readonly">Ronde ${r.no} · alleen lezen — resultaten van deze ronde blijven bewaard.
      <button type="button" data-r="${p.rounds.length - 1}">Naar ronde ${cur.no} (actueel)</button></p>` : ''}
    <div class="workbench">
      <section class="group analyses" aria-labelledby="g-an"><header><h2 id="g-an">Analyses · ronde ${r.no}</h2></header><div class="runs"></div></section>
    </div>
  </section>`);
  const meter = view.querySelector('.meter');
  const label = view.querySelector('.meter-label');
  const runs = view.querySelector('.runs');
  const paint = () => runs.replaceChildren(runCard(p, ri, 'tek', readOnly), runCard(p, ri, 'bst', readOnly));
  const refresh = () => {
    // Per discipline een groepje blokjes (één per tekening), daarna het bestek.
    meter.innerHTML = DISCIPLINES.map(d => {
      const n = d.key === 'BST' ? (r.files.BST ? 1 : 0) : list(r.files, d.key).length;
      return `<span class="mg" title="${d.key}: ${d.key === 'BST' ? (n ? 'ontvangen' : 'ontbreekt') : plural(n, 'tekening')}">${
        n ? '<i class="ok"></i>'.repeat(Math.min(n, 6)) : '<i></i>'}</span>`;
    }).join('');
    label.textContent = `${plural(nDrawings(r.files), 'tekening')} in ${nDiscs(r.files)} van 4 disciplines${r.files.BST ? ' + bestek' : ', bestek ontbreekt'} · ronde ${r.no}`;
    paint();
  };
  view.querySelector('.analyses').before(documents(r.files, { round: r.no, readOnly, onChange: refresh, rerender: () => renderDetail(p) }));

  view.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {
    p.view = +b.dataset.r;
    renderDetail(p);
    app.querySelector(`.tabs [data-r="${p.view}"]`).focus();
  }));
  view.querySelector('[data-new]').addEventListener('click', e => {
    if (e.currentTarget.getAttribute('aria-disabled') === 'true') return;
    const analysed = Object.values(cur.runs).some(list => list?.length);
    p.rounds.push({ no: cur.no + 1, created: new Date(), files: cloneFiles(cur.files), runs: {} });
    p.view = p.rounds.length - 1;
    renderDetail(p, analysed
      ? { text: `Ronde ${cur.no + 1} gestart met de documenten uit ronde ${cur.no}. Vervang wat gewijzigd is en draai de analyses opnieuw.` }
      : { text: `Ronde ${cur.no + 1} gestart. Let op: ronde ${cur.no} is nooit geanalyseerd.`, warn: true });
    app.querySelector('[data-new]').focus();
  });

  openDetail = { project: p, node: view, paint };
  refresh();
  app.replaceChildren(view);
}

/* ---------- Analysescherm: voortgang tijdens de run, samenvatting na afloop ---------- */
const fmtDur = ms => {
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} s`;
};
const fmtClock = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const ernstCounts = fs => ERNST.map(e => fs.filter(f => f.ernst === e).length);

function partBlock(no, name, state, sum, body = '') {
  return `<section class="part ${state}" aria-label="Deel ${no}: ${esc(name)}">
    <header><span class="pno" aria-hidden="true">${state === 'done' ? '✓' : no}</span><h2>${esc(name)}</h2><span class="psum">${sum}</span></header>
    ${body ? `<div class="part-body">${body}</div>` : ''}</section>`;
}

// Resterende tijd deel 1: alleen in de laatste (regelmatige) stap, na minstens 5 eenheden, en niet als de tempo's sterk wisselen.
function p1Eta(plan, v) {
  const si = plan.steps.length - 1;
  const us = plan.units.filter(u => u.si === si);
  const done = us.filter(u => u.t1 <= v);
  if (!plan.steps[si].eta || done.length < 5 || done.length === us.length) return '';
  const d = done.map(u => u.t1 - u.t0), m = d.reduce((a, b) => a + b) / d.length;
  const sd = Math.sqrt(d.reduce((a, b) => a + (b - m) ** 2, 0) / d.length);
  if (sd / m > .6) return '';
  const cur = us[done.length];
  const left = (us.length - done.length) * m - Math.max(0, v - cur.t0);
  return left < 10000 ? 'nog enkele seconden' : `nog ca. ${Math.ceil(left / 10000) * 10} s`;
}
// Bandbreedte deel 2: pas na 3 gemeten items en bij minstens 5 items; gemiddelde ± spreiding, in hele minuten.
function p2Band(plan, v) {
  const done = plan.items.filter(i => i.t1 <= v && !i.fail);
  const left = plan.items.filter(i => i.t1 > v);
  if (plan.items.length < 5 || done.length < 3 || !left.length) return '';
  const d = done.map(i => i.dur), m = d.reduce((a, b) => a + b) / d.length;
  const sd = Math.sqrt(d.reduce((a, b) => a + (b - m) ** 2, 0) / d.length);
  const mid = left.length * m - Math.max(0, v - left[0].t0), spread = Math.sqrt(left.length) * sd;
  const lo = Math.max(1, Math.floor((mid - spread) / 60000)), hi = Math.max(1, Math.ceil((mid + spread) / 60000));
  return hi <= 1 ? 'nog ongeveer een minuut' : lo >= hi ? `nog rond ${hi} min` : `nog ca. ${lo}–${hi} min`;
}

function progressHTML(plan, v) {
  const P = PARTS[plan.kind];
  let html = '';
  if (!plan.steps.length) {
    html += partBlock(1, P.p1, 'done', 'uit de eerdere run');
  } else if (v >= plan.T1) {
    const ls = plan.steps.at(-1), k = plan.items.length;
    html += partBlock(1, P.p1, 'done', plan.kind === 'tek'
      ? `${plural(ls.durs.length, ls.unit)} · ${plural(k, 'afwijking')} · ${fmtDur(plan.T1)}`
      : `${plural(ls.durs.length, ls.unit)} doorzocht · ${k} met tekeningverwijzing · ${fmtDur(plan.T1)}`);
  } else {
    const steps = plan.steps.map((s, si) => {
      const us = plan.units.filter(u => u.si === si);
      const done = us.filter(u => u.t1 <= v).length;
      const st = done === us.length ? 'ok' : us[0].t0 <= v ? 'now' : 'todo';
      const which = st === 'now' && s.labels ? ` · ${s.labels[done]}` : '';
      const mini = st === 'now' ? `<i class="mini" aria-hidden="true"><b style="width:${Math.round(done / us.length * 100)}%"></b></i>` : '<i></i>';
      return `<li class="${st}"><span class="ic" aria-hidden="true">${st === 'ok' ? '✓' : st === 'now' ? '▸' : ''}</span><span>${s.name}${
        s.varies && st === 'now' ? ' <small>(duur wisselt per tekening)</small>' : ''}</span>
        <span class="num">${st === 'now' ? `${s.unit} ${done + 1} van ${us.length}${which}` : plural(us.length, s.unit)}</span>${mini}</li>`;
    }).join('');
    const pct = p1Pct(plan, v);
    const found = plan.items.filter(i => i.foundAt <= v).length;
    const what = plan.kind === 'tek'
      ? `<b>${found}</b> ${found === 1 ? 'laag wijkt' : 'lagen wijken'} af tot nu toe`
      : `<b>${found}</b> ${found === 1 ? 'post verwijst' : 'posten verwijzen'} naar een tekening`;
    html += partBlock(1, P.p1, 'active', `<span title="Gewogen schatting: elke stap heeft vaste kosten per eenheid (in het echt te kalibreren). Tekstherkenning kan afwijken.">${pct}% van deel 1 ⓘ</span>`, `
      <ol class="substeps">${steps}</ol>
      <div class="bigbar" role="progressbar" aria-label="Voortgang ${P.p1.toLowerCase()}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <p class="pline"><span>${what}</span><span>${p1Eta(plan, v)}</span></p>`);
  }

  const n = plan.items.length;
  const name2 = `${P.p2} (met AI)`;
  if (v < plan.T1) {
    html += partBlock(2, name2, 'todo', 'na deel 1', `<p class="muted">Start zodra deel 1 klaar is: één AI-beoordeling per ${P.ai}.
      Duurt enkele minuten, afhankelijk van het aantal ${P.aiPl}.</p>`);
  } else if (!n) {
    html += partBlock(2, name2, 'done', `geen ${P.aiPl}, niets te beoordelen`);
  } else {
    const k = plan.items.filter(i => i.t1 <= v).length;
    const fails = plan.items.filter(i => i.fail && i.t1 <= v);
    const cur = plan.items.find(i => i.t1 > v);
    const cells = n <= 20
      ? `<div class="boxes" aria-hidden="true">${plan.items.map(i => `<i class="${i.t1 <= v ? (i.fail ? 'fail' : 'ok') : i === cur ? 'busy' : ''}" title="${esc(i.code)} · ${esc(i.label)}"></i>`).join('')}</div>`
      : `<div class="seg" aria-hidden="true"><i class="ok" style="flex:${k - fails.length}"></i><i class="fail" style="flex:${fails.length}"></i><i class="busy" style="flex:${cur ? 1 : 0}"></i><i style="flex:${n - k - (cur ? 1 : 0)}"></i></div>`;
    const failList = fails.length ? `<ul class="fails">${fails.map(i => `<li>⚠ <span class="mono">${esc(i.code)}</span> · ${esc(i.label)}: mislukt (time-out). Na afloop opnieuw te proberen.</li>`).join('')}</ul>` : '';
    const ai = plan.agent.findIndex(x => x.t1 > v), agentStep = ai < 0 ? plan.agent.length - 1 : ai;
    const body = `${cells}
      <p class="pline"><span><b>${k} van ${n}</b> beoordeeld${fails.length ? ` · <span class="bad">${fails.length} mislukt</span>` : ''}</span><span>${cur ? p2Band(plan, v) : ''}</span></p>
      ${cur ? `<p class="now">Nu: <span class="mono">${esc(cur.code)}</span> · ${esc(cur.label)} <span class="muted">· ${fmtDur(v - cur.t0)} bezig</span></p>` : ''}
      ${failList}
      ${!cur ? `<div class="agent"><div class="bar indet"><i></i></div><span>Bevindingen samenstellen · stap ${agentStep + 1} <span class="muted">(max 20)</span></span></div>` : ''}`;
    html += partBlock(2, name2, 'active', `${k} van ${n}`, body);
  }
  return html;
}

function inputsHTML(used, r) {
  const items = Object.entries(used);
  const nT = items.filter(([k]) => keyDisc(k) !== 'BST').length;
  return `<div class="side-box"><p class="label">Invoer · ronde ${r.no} · ${plural(nT, 'tekening')}${items.length > nT ? ' + bestek' : ''}</p><ul class="inputs">${items.map(([k, f]) => {
    const w = nameCheck(keyDisc(k), f.name);
    return `<li><span class="code-s">${keyDisc(k)}</span><span class="fn" title="${esc(f.name)}">${esc(tail(f.name, 27))}</span>${w ? `<span class="bad">⚠ ${esc(w.msg)}</span>` : ''}</li>`;
  }).join('')}</ul></div>`;
}
const logItems = (log, v = Infinity) => log.filter(e => e.t <= v).reverse()
  .map(e => `<li${e.warn ? ' class="warn"' : ''}><span class="t">${fmtClock(e.t)}</span><span>${e.warn ? '⚠ ' : ''}${esc(e.text)}</span></li>`).join('');

function summaryHTML(p, ri, kind, run, readOnly) {
  const P = PARTS[kind];
  const [h, m, l] = ernstCounts(run.findings);
  const prevRound = p.rounds[ri - 1];
  const prev = prevRound?.runs[kind]?.at(-1);
  const dash = p.id === 'P051-690';
  let cmp;
  if (!prevRound) cmp = `<p class="muted">Eerste controleronde, nog niets om mee te vergelijken.</p>`;
  else if (!prev) cmp = `<p class="muted">Ronde ${prevRound.no} is niet met deze analyse gecontroleerd, dus geen vergelijking.</p>`;
  else {
    const was = new Set(prev.findings.map(f => f.key)), now = new Set(run.findings.map(f => f.key));
    const nw = [...now].filter(x => !was.has(x)).length, gone = [...was].filter(x => !now.has(x)).length;
    cmp = `<dl class="tally cmp"><div><dt>Nieuw</dt><dd>${nw}</dd></div><div><dt>Opgelost</dt><dd>${gone}</dd></div><div><dt>Nog open</dt><dd>${now.size - nw}</dd></div></dl>`;
  }
  const top = [...run.findings].sort((a, b) => ERNST.indexOf(a.ernst) - ERNST.indexOf(b.ernst)).slice(0, 3);
  const perDisc = {};
  run.findings.forEach(f => f.disc.split('/').forEach(d => { perDisc[d] = (perDisc[d] || 0) + 1; }));
  const discOrder = [...DRAWINGS.map(d => d.key), 'Algemeen'].filter(d => perDisc[d]);
  const notChecked = [
    ...run.failed.map(f => `${f.code} · ${f.label}: AI-beoordeling mislukt`),
    ...DRAWINGS.filter(d => !Object.keys(run.used).some(k => keyDisc(k) === d.key)).map(d => `${d.key} (${d.name}): geen tekening aangeleverd`),
    ...Object.entries(run.used).filter(([k, f]) => nameCheck(keyDisc(k), f.name))
      .map(([k, f]) => `${keyLabel(k, f)}: bestandsnaam wijkt af (${nameCheck(keyDisc(k), f.name).msg.replace('Lijkt', 'lijkt')}), resultaten voor deze tekening zijn onzeker`),
    ...(kind === 'tek' ? ['Bestek: valt onder de bestekanalyse'] : []),
  ];
  const retry = run.failed.length && !readOnly ? `<div class="warnbox" role="note"><p>⚠ ${plural(run.failed.length, 'item')} niet beoordeeld:
      ${run.failed.map(f => `<span class="mono">${esc(f.code)}</span> · ${esc(f.label)}`).join(', ')}. De bevindingen daarvan ontbreken.</p>
      <button class="btn sm" type="button" data-retry>Opnieuw proberen (alleen ${run.failed.length === 1 ? 'dit item' : 'deze items'})</button></div>` : '';

  return `<section class="result" aria-label="Samenvatting">
    <div class="res-top">
      <div><p class="label">Resultaat</p><p class="big">${run.count} <span>${run.count === 1 ? 'bevinding' : 'bevindingen'}</span></p>
        <p class="ernst"><span class="e-hoog">${h} Hoog</span> · <span>${m} Midden</span> · <span class="e-laag">${l} Laag</span></p>
        ${discOrder.length ? `<p class="disc">Betrokken disciplines: ${discOrder.map(d => d === 'Algemeen' ? 'algemeen' : discName(d)).join(', ')}</p>` : ''}</div>
      <div class="res-act">${dash
        ? `<a class="btn" href="bevindingen.html" target="_blank" rel="noopener">Open bevindingen ↗</a><span class="why">Bevindingen-dashboard, opent in een nieuw tabblad</span>`
        : `<button class="btn" type="button" aria-disabled="true">Open bevindingen</button><span class="why">Alleen voor P051-690 bestaat er al een bevindingen-dashboard.</span>`}</div>
    </div>
    ${retry}
    ${!run.nItems ? `<p class="note">Geen ${P.aiPl} gevonden, dus niets te beoordelen. Dat betekent niet dat alles klopt: zie "Niet gecontroleerd".</p>` : ''}
    <section class="block"><h2>Vergelijking met ${prevRound ? `ronde ${prevRound.no}` : 'vorige ronde'}</h2>${cmp}</section>
    ${top.length ? `<section class="block"><h2>Hoogste ernst</h2><ol class="top">${top.map(f => `<li>
      <span class="e-tag e-${f.ernst.toLowerCase()}">${f.ernst}</span>
      <div><p>${esc(f.text)}</p><small>${f.id ? `<span class="mono">${f.id}</span> · ` : ''}${esc(f.disc)}${f.tek ? ' · ' + esc(f.tek) : ''}</small></div></li>`).join('')}</ol></section>` : ''}
    ${notChecked.length ? `<section class="block"><h2>Niet gecontroleerd</h2><ul class="notchecked">${notChecked.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}
  </section>`;
}

function renderAnalysis(p, ri, kind) {
  openDetail = null;
  const r = p.rounds[ri], a = ANALYSES[kind], P = PARTS[kind], key = runKey(r, kind);
  const readOnly = ri < p.rounds.length - 1;
  delete p.unseen[key];
  setSheet(`${a.title} — ronde ${r.no}`, p.number, null);
  const live = p.live[key];
  const last = r.runs[kind]?.at(-1);
  const cancelled = p.cancelled[key];
  const ready = a.reqs(r.files).every(x => x.ok);
  const status = live ? ['busy', 'Bezig'] : cancelled && !last ? ['', 'Geannuleerd']
    : last ? (last.status === 'warn' ? ['warn', 'Gereed met waarschuwingen'] : ['done', 'Gereed']) : ['', 'Niet gedraaid'];
  const projectHash = '#/project/' + encodeURIComponent(p.id);

  const view = el(`<section class="analysis">
    <nav class="crumbs" aria-label="Kruimelpad"><a href="#/">Register</a> <span aria-hidden="true">›</span>
      <a href="${projectHash}" data-view>${esc(p.name)}</a> <span aria-hidden="true">›</span>
      <a href="${projectHash}" data-view>Ronde ${r.no}</a> <span aria-hidden="true">›</span> <span aria-current="page">${a.title}</span></nav>
    <div class="view-head an-head">
      <div><p class="label"><span class="pnr">${esc(p.number)}</span> · controleronde ${r.no}${readOnly ? ' (alleen lezen)' : ''}</p><h1>${a.title}</h1></div>
      <div class="an-status"><span class="chip ${status[0]}" role="status">${status[1]}</span><span class="clock"></span></div>
      <div class="an-actions"></div>
    </div>
    ${p.id === 'P051-690' ? `<p class="note">Demo: voortgang en duur zijn gesimuleerd. De bevindingen komen uit onze testruns op deze set tekeningen en dit bestek.</p>` : ''}
    <p class="sr say" aria-live="polite"></p>
    <div class="an"><div class="an-main"></div><aside class="an-side" aria-label="Invoer en logboek"></aside></div>
  </section>`);
  const main = view.querySelector('.an-main'), side = view.querySelector('.an-side');
  const clock = view.querySelector('.clock'), actions = view.querySelector('.an-actions');
  view.querySelectorAll('[data-view]').forEach(x => x.addEventListener('click', () => { p.view = ri; }));
  const rerender = focusSel => { renderAnalysis(p, ri, kind); if (focusSel) app.querySelector(focusSel)?.focus(); };
  const startBtn = (label, cls = 'btn sm') => !readOnly && ready ? `<button class="${cls}" type="button" data-start>${label}</button>` : '';
  let tick = null;

  if (live) {
    const plan = live.plan;
    actions.innerHTML = `<button class="btn sm ghost" type="button" data-cancel>Annuleren</button>`;
    side.innerHTML = `<div class="side-box tallybox"></div>
      <p class="leave">Je kunt dit scherm verlaten; de analyse loopt door. De status staat op de projectpagina en in het register.</p>
      ${inputsHTML(plan.used, r)}
      <details class="side-box"><summary>Logboek</summary><ol class="log"></ol></details>`;
    const tally = side.querySelector('.tallybox'), logEl = side.querySelector('.log');
    const say = view.querySelector('.say');
    let lastSaid = '';
    const wireCancel = () => actions.querySelector('[data-cancel]').addEventListener('click', () => {
      actions.innerHTML = `<span class="confirm">Analyse stoppen? De voortgang gaat verloren.</span>
        <button class="btn sm danger" type="button" data-yes>Ja, stoppen</button><button class="btn sm ghost" type="button" data-no>Doorgaan</button>`;
      actions.querySelector('[data-no]').focus();
      actions.querySelector('[data-yes]').addEventListener('click', () => { cancelRun(p, ri, kind); rerender('[data-start]'); });
      actions.querySelector('[data-no]').addEventListener('click', () => {
        actions.innerHTML = `<button class="btn sm ghost" type="button" data-cancel>Annuleren</button>`;
        wireCancel();
        actions.querySelector('[data-cancel]').focus();
      });
    });
    wireCancel();
    tick = () => {
      if (!view.isConnected) return;
      if (p.live[key] !== live) return rerender();
      const v = vNow(live);
      const fs = plan.items.filter(i => i.t1 <= v && !i.fail).flatMap(i => i.findings);
      const hoog = fs.filter(f => f.ernst === 'Hoog').length;
      const lastAct = plan.log.filter(e => e.t <= v).at(-1);
      const ago = lastAct ? v - lastAct.t : v;
      main.innerHTML = progressHTML(plan, v);
      const fails = plan.items.filter(i => i.fail && i.t1 <= v).length;
      const phase = v < plan.T1 ? `Deel 1, ${P.p1}` : plan.items.some(i => i.t1 > v) ? `Deel 2, ${P.p2}` : 'Bevindingen samenstellen';
      const msg = `${phase}${fails ? `. ${plural(fails, 'item')} mislukt` : ''}`;
      if (msg !== lastSaid) { say.textContent = lastSaid ? msg : ''; lastSaid = msg; }
      tally.innerHTML = `<p class="label">Bevindingen tot nu toe</p><p class="big">${fs.length}</p>
        <p>${hoog ? `<span class="e-hoog">waarvan ${hoog} Hoog</span>` : 'nog geen met ernst Hoog'}</p>
        <p class="muted small">${v < plan.T1 ? 'Bevindingen komen binnen tijdens deel 2.' : 'Verdeling naar ernst volgt na afloop.'}</p>`;
      logEl.innerHTML = logItems(plan.log, v);
      clock.innerHTML = `Verstreken <b>${fmtDur(v)}</b> · laatste activiteit ${ago < 3000 ? 'zojuist' : fmtDur(ago) + ' geleden'}<small>Demo: ${SPEED}× versneld · tijden gesimuleerd</small>`;
      setTimeout(tick, 250);
    };
  } else if (last) {
    clock.innerHTML = `Gereed in <b>${fmtDur(last.ms)}</b> · ${fmtTime(last.at)}<small>Gesimuleerde duur</small>`;
    actions.innerHTML = startBtn('Opnieuw draaien', 'btn sm ghost');
    const stale = changesSince(last, r.files, kind);
    main.innerHTML = (cancelled ? `<p class="note">Een nieuwe poging is geannuleerd na ${fmtDur(cancelled.v)}. Hieronder het resultaat van de laatste afgeronde run.</p>` : '')
      + (stale.length && !readOnly ? `<p class="warnline">Verouderd: ${esc(stale.join(', '))} sinds deze run. Draai opnieuw voor actuele bevindingen.</p>` : '')
      + summaryHTML(p, ri, kind, last, readOnly);
    side.innerHTML = `${inputsHTML(last.used, r)}
      <details class="side-box"><summary>Verloop en logboek</summary><div class="flow">
        <p class="line"><span class="ok" aria-hidden="true">✓</span> ${P.p1} · ${plural(last.p1.n, last.p1.unit)} · ${fmtDur(last.p1.ms)}</p>
        <p class="line"><span class="ok" aria-hidden="true">✓</span> ${P.p2} · ${plural(last.nItems, P.ai)}${last.failed.length ? ` · <span class="bad">${last.failed.length} mislukt</span>` : ''}</p>
        <p class="muted small">In het echt hangt de duur van deel 2 af van de AI-dienst.</p></div>
        <ol class="log">${logItems(last.log)}</ol></details>`;
    main.querySelector('[data-retry]')?.addEventListener('click', () => { startRun(p, ri, kind, last); rerender('[data-cancel]'); });
  } else {
    actions.innerHTML = startBtn(cancelled ? 'Opnieuw starten' : a.start);
    main.innerHTML = cancelled
      ? `<p class="note">Geannuleerd na ${fmtDur(cancelled.v)}. Er zijn geen resultaten bewaard.</p>`
      : `<p class="note">Deze analyse is in ronde ${r.no} nog niet gedraaid.${ready ? '' : ` Eerst nodig: ${esc(a.reqs(r.files).filter(x => !x.ok).map(x => x.short).join(', '))}.`}</p>`;
    if (ready && !readOnly) main.innerHTML += partBlock(1, P.p1, 'todo', `ca. ${expectP1(r.files, kind)} min`) + partBlock(2, `${P.p2} (met AI)`, 'todo', 'enkele minuten');
    side.innerHTML = inputsHTML(snapshot(r.files, kind), r);
  }
  actions.querySelector('[data-start]')?.addEventListener('click', () => { startRun(p, ri, kind); rerender('[data-cancel]'); });
  app.replaceChildren(view);
  tick?.();
}

function route() {
  const m = location.hash.match(/^#\/project\/([^/]+)(?:\/r(\d+)\/(tek|bst))?$/);
  const project = m && projects.find(p => p.id === decodeURIComponent(m[1]));
  const ri = project && m[2] ? project.rounds.findIndex(r => r.no === +m[2]) : -1;
  if (location.hash === '#/nieuw') renderNew();
  else if (ri >= 0) renderAnalysis(project, ri, m[3]);
  else if (project) renderDetail(project);
  else renderRegister();
  app.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

// Voorkom dat de browser een PDF opent als die naast een blok wordt losgelaten.
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => e.preventDefault());
addEventListener('hashchange', route);
route();
</script>
</body>
